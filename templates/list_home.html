{% extends "base.html" %}

{% block title %}加载中...{% endblock %}

{% block styles %}
    <style>
        .movie-card {
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: transform .25s ease, box-shadow .25s ease;
        }
        .movie-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-3);
        }
        .movie-card img { width: 100%; height: 220px; object-fit: cover; transition: transform .4s ease; }
        .movie-card:hover img { transform: scale(1.04); }
        .filter-section {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 .125rem .25rem rgba(0,0,0,.075);
        }
        .group-title {
            font-weight: 600;
            margin-top: 16px;
            margin-bottom: 10px;
            color: #374151;               /* 高级深灰 */
            border-bottom: 1px solid #e5e7eb; 
            padding-bottom: 6px;
            font-size: 0.95rem;
            letter-spacing: 0.3px; 
        }
        .filter-radio-group label {
            margin-right: 12px;
        }
        /* 信息标签胶囊 */
        .info-chip {
            display: inline-flex;
            align-items: center;
            background: #f5f6ff;
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid #c7d2fe;
            color: #4f46e5;
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.6;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.08);
        }
        .info-chip .icon {
            margin-right: 6px;
            font-size: 1.1rem;
            line-height: 1;
        }

        /* ===== 筛选/排序按钮：未选中 ===== */
        .custom-radio-label {
            border: 1px solid #e5e7eb !important;
            border-radius: 0.375rem !important;
            padding: 0.375rem 0.75rem;
            background-color: #ffffff !important;
            color: #4b5563 !important;
            font-weight: 500;
            margin-bottom: 4px;
            transition: background-color 0.22s ease, color 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, transform 0.22s ease;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }
        /* ===== 未选中悬停 ===== */
        .btn-check:not(:checked) + .custom-radio-label:hover {
            background-color: #f5f6ff !important;
            border-color: #c7d2fe !important;
            color: #4f46e5 !important;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.12);
        }
        /* ===== 选中 ===== */
        .btn-check:checked + .custom-radio-label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: #fff !important;
            border-color: transparent !important;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
        }
        /* ===== 选中悬停 ===== */
        .btn-check:checked + .custom-radio-label:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
        }
        /* ===== 按下 ===== */
        .custom-radio-label:active {
            transform: scale(0.97);
        }

        /* 👇 新增：彻底去除点击/聚焦时的原生蓝色外发光（解决闪蓝问题） */
        .btn-check:focus + .custom-radio-label,
        .btn-check:active + .custom-radio-label {
            outline: none !important;
            box-shadow: none !important;
        }
        .btn-check:checked:focus + .custom-radio-label {
            outline: none !important;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35) !important;
        }

        /* ===== 分页容器 ===== */
        #pagination {
            margin-top: 2rem !important;
        }

        #paginationList {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            align-items: center;
        }

        #paginationList .page-item {
            margin: 0;
        }

        #paginationList .page-item .page-link {
            min-width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            margin-left: 0 !important;
            border: 1px solid #e9ecef;
            border-radius: 10px !important;
            background: #fff;
            color: #495057;
            font-weight: 500;
            font-size: 0.9rem;
            line-height: 1;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
            text-decoration: none;
        }

        #paginationList .page-item .page-link:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
            color: #4f46e5;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.12);
        }

        #paginationList .page-item.active .page-link {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
        }

        #paginationList .page-item.disabled .page-link {
            background: #f8f9fa;
            border-color: #f1f3f5;
            color: #adb5bd;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        #paginationList .page-item.disabled .page-link:hover {
            background: #f8f9fa;
            border-color: #f1f3f5;
            color: #adb5bd;
            transform: none;
            box-shadow: none;
        }

        /* ===== 跳页区 ===== */
        #paginationList .jump-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 10px;
        }

        #jumpPageInput {
            width: 64px;
            height: 40px;
            border-radius: 10px !important;
            border: 1px solid #e9ecef !important;
            text-align: center;
            font-weight: 500;
            color: #495057;
            transition: all 0.2s;
            padding: 0 !important;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        #jumpPageInput::-webkit-outer-spin-button,
        #jumpPageInput::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #jumpPageInput:focus {
            border-color: #a5b4fc !important;
            box-shadow: 0 0 0 3px rgba(165, 180, 252, 0.25);
            outline: none;
        }

        #paginationList .jump-btn {
            height: 40px;
            padding: 0 16px;
            border-radius: 10px !important;
            border: 1px solid #c7d2fe;
            background: #fff;
            color: #4f46e5;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            margin-left: 0 !important;
        }

        #paginationList .jump-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
            transform: translateY(-1px);
        }

        /* ===== 小屏适配 ===== */
        @media (max-width: 576px) {
            #paginationList { gap: 4px; }
            #paginationList .page-item .page-link {
                min-width: 34px;
                height: 34px;
                padding: 0 8px;
                font-size: 0.82rem;
            }
            #jumpPageInput,
            #paginationList .jump-btn {
                height: 34px;
            }
            #jumpPageInput { width: 54px; }
        }

                /* ===== 刷新按钮（品牌渐变） ===== */
        .btn-brand {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            border: none !important;
            color: #fff !important;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-brand:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
            color: #fff !important;
        }
        .btn-brand:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }

        /* ===== 清单头部图标（淡紫圆角块） ===== */
        .list-header-icon {
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6ff;
            border: 1px solid #c7d2fe;
            border-radius: 16px;
            font-size: 2.5rem;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
            flex-shrink: 0;
        }

        /* ===== 专属收藏按钮 ===== */
        .btn-collect {
            background: #fff !important;
            border: 1px solid #c7d2fe !important;
            color: #4f46e5 !important;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.1);
            font-size: 0.85rem;
            padding: 6px 18px;
        }
        .btn-collect:hover {
            background: #f5f6ff !important;
            border-color: #667eea !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }
        /* 已收藏状态：渐变实心 */
        .btn-collect.collected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            border-color: transparent !important;
            color: #fff !important;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
        }
        .btn-collect.collected:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
        }

        /* ===== 移动端头部排版适配 ===== */
        @media (max-width: 768px) {
            .list-header-icon {
                font-size: 2rem !important;
                width: 56px;
                height: 56px;
            }
            #listName {
                font-size: 1.5rem;
            }
        }
    </style>
{% endblock %}

{% block content %}
<div id="listProfile" class="card mb-4 d-none shadow-sm">
    <div class="card-body">
        <div class="d-flex flex-column flex-md-row align-items-center align-items-md-start mb-4 gap-3 gap-md-4 text-center text-md-start">
            <!-- 左侧图标 -->
            <div class="list-header-icon">
                📋
            </div>
            
            <!-- 右侧内容 -->
            <div class="flex-grow-1" style="min-width: 0;">
                <!-- 紫蓝渐变标题 -->
                <h2 id="listName" class="mb-3 fw-bold text-break" style="font-size: 2rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.5px;"></h2>
                
                <!-- 按钮与胶囊同行 -->
                <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-start gap-2 mb-3">
                    <button id="btnCollectList" class="btn btn-collect rounded-pill d-none" onclick="toggleCollectList()">
                        ⭐ 收藏
                    </button>
                    <div id="listMeta" class="d-flex flex-wrap align-items-center gap-2"></div>
                </div>
                
                <div id="listDescription" class="text-secondary text-break"></div>
            </div>
        </div>

        <!-- ===== 筛选 & 排序区域（两行结构） ===== -->
        <div class="filter-section border shadow-sm mb-4">
            <!-- 第一行：筛选 + 搜索 -->
            <div class="row align-items-center">
                <div class="col-md-10 d-flex flex-wrap gap-2 align-items-center">
                    <span class="fw-bold text-muted small">筛选：</span>

                    <input type="radio" class="btn-check list-filter-radio" name="listFilter" id="lf_all" value="" checked>
                    <label class="btn custom-radio-label btn-sm" for="lf_all">全部</label>

                    <input type="radio" class="btn-check list-filter-radio" name="listFilter" id="lf_play" value="p">
                    <label class="btn custom-radio-label btn-sm" for="lf_play">可播放</label>

                    <input type="radio" class="btn-check list-filter-radio" name="listFilter" id="lf_magnet" value="m">
                    <label class="btn custom-radio-label btn-sm" for="lf_magnet">含磁链</label>

                    <input type="radio" class="btn-check list-filter-radio" name="listFilter" id="lf_sub" value="c">
                    <label class="btn custom-radio-label btn-sm" for="lf_sub">含字幕</label>
                </div>
                <div class="col-md-2 text-end">
                    <button class="btn btn-brand btn-sm w-100" style="border-radius: 0.375rem;" onclick="loadListMovies(1)">刷新数据</button>
                </div>
            </div>

            <!-- 第二行：排序（独占整行） -->
            <div class="row">
                <div class="col-12 d-flex flex-wrap align-items-center gap-2 mt-3">
                    <span class="fw-bold text-muted small" style="white-space: nowrap;">排序：</span>

                    <input type="radio" class="btn-check sort-radio" name="listSort" id="list_sort_update" value="update" checked>
                    <label class="btn custom-radio-label btn-sm" for="list_sort_update">存入时间倒序</label>

                    <input type="radio" class="btn-check sort-radio" name="listSort" id="list_sort_release" value="release">
                    <label class="btn custom-radio-label btn-sm" for="list_sort_release">创建时间倒序</label>

                    <input type="radio" class="btn-check sort-radio" name="listSort" id="list_sort_score" value="score">
                    <label class="btn custom-radio-label btn-sm" for="list_sort_score">评分倒序</label>
                </div>
            </div>
        </div>
        <!-- 清单信息错误容器（默认隐藏） -->
        <div id="listInfoError" class="text-danger mt-2" style="display:none;"></div>
    </div>
</div>

<div class="row" id="moviesContainer"></div>

<nav aria-label="Page navigation" class="mt-4 d-none" id="pagination">
    <ul class="pagination justify-content-center mb-0" id="paginationList"></ul>
</nav>
{% endblock %}

{% block scripts %}
<script>
    function formatDate(isoString) {
        const d = new Date(isoString);
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    const initialListId = '{{ list_id }}';
    let currentListId = '';
    let currentPage = 1;
    let isListCollected = false;

    // ========== 防抖 ==========
    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => { func.apply(this, args); }, wait);
        };
    }
    const debouncedLoadListMovies = debounce(() => loadListMovies(1), 500);

    // ========== 加载清单信息 ==========
    async function loadListInfo(listId) {
        const profileDiv = document.getElementById('listProfile');
        const nameEl = document.getElementById('listName');
        const metaEl = document.getElementById('listMeta');
        const descEl = document.getElementById('listDescription');
        const errorEl = document.getElementById('listInfoError');
        const btnCollect = document.getElementById('btnCollectList');

        try {
            const res = await fetch(`/api/list/${listId}`);
            const data = await res.json();
            if (!data.success) throw new Error(data.message || '获取清单信息失败');

            const list = data.data.list;
            currentListId = listId;

            // 显示正常信息
            nameEl.innerText = list.name;
            document.title = list.name + ' - JavDB';

            isListCollected = data.data.has_collected || false;
            updateCollectButton();

            let metaHtml = [];
            metaHtml.push(`<span class="info-chip"><span class="icon">📀</span>作品 ${list.movies_count}</span>`);
            metaHtml.push(`<span class="info-chip"><span class="icon">👁️</span>浏览 ${list.views_count}</span>`);
            metaHtml.push(`<span class="info-chip"><span class="icon">⭐</span>收藏 ${list.collections_count}</span>`);
            if (list.created_at) {
                metaHtml.push(`<span class="info-chip"><span class="icon">📅</span>创建于 ${formatDate(list.created_at)}</span>`);
            }
            metaEl.innerHTML = metaHtml.join(' ');
            descEl.innerText = list.description || '';

            // 显示卡片，隐藏错误
            profileDiv.classList.remove('d-none');
            errorEl.style.display = 'none';
            errorEl.innerHTML = '';
            btnCollect.style.display = 'inline-block';   // 确保收藏按钮显示

            // 加载影片列表
            await loadListMovies(1);
        } catch (e) {
            console.error("加载清单信息失败", e);
            // 显示错误，隐藏正常内容
            profileDiv.classList.remove('d-none');
            errorEl.style.display = 'block';
            errorEl.innerHTML = `
                <div class="text-center">
                    加载清单信息失败：${e.message}<br>
                    <button class="btn btn-outline-primary btn-sm mt-2" onclick="loadListInfo('${listId}')">重试</button>
                </div>
            `;
            // 清空正常内容
            nameEl.innerText = '';
            metaEl.innerHTML = '';
            descEl.innerText = '';
            btnCollect.style.display = 'none';
            // 隐藏影片区域
            document.getElementById('moviesContainer').innerHTML = '';
            document.getElementById('pagination').classList.add('d-none');
            document.title = '加载清单失败 - JavDB';
        }
    }

    // ========== 加载清单影片 ==========
    async function loadListMovies(page, scrollToTop = false) {
        currentPage = page;

        const container = document.getElementById('moviesContainer');
        const paginationEl = document.getElementById('pagination');

        container.innerHTML = `
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2 text-muted">加载中...</p>
            </div>
        `;
        paginationEl.classList.add('d-none');

        const filterVal = document.querySelector('input[name="listFilter"]:checked').value;
        // ===== 从排序 radio 获取值 =====
        const sortRadio = document.querySelector('.sort-radio:checked');
        const sortBy = sortRadio ? sortRadio.value : 'update';
        const orderBy = 'desc';   // 固定倒序

        const params = new URLSearchParams({
            list_id: currentListId,
            filter_by: filterVal,
            sort_by: sortBy,
            order_by: orderBy,
            page: page,
            limit: 24
        });

        try {
            const res = await fetch('/api/list-movies?' + params.toString());
            const data = await res.json();
            if (!data.success) throw new Error(data.message || '加载失败');

            const movies = data.data.movies || [];
            renderMovieCards(movies);

            // 无条件渲染分页：空数据也显示
            renderPagination(page, movies.length);

            if (scrollToTop) {
                document.getElementById('moviesContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        } catch (e) {
            container.innerHTML = `
                <div class="col-12 text-center text-danger py-5">
                加载失败：${e.message}
                <div><button class="btn btn-primary mt-2" onclick="loadListMovies(${currentPage}, true)">重试</button></div>
            </div>
           `;
           paginationEl.classList.add('d-none');   // ← 补上
        }
    }

    // ========== 渲染影片卡片 ==========
    function renderMovieCards(movies) {
        const container = document.getElementById('moviesContainer');
        container.innerHTML = '';
        if (movies.length === 0) {
            container.innerHTML = '<div class="col-12 text-center text-muted py-5">暂无影片</div>';
            return;
        }
        movies.forEach(movie => {
            const coverFixed = `/api/image?url=${encodeURIComponent(movie.cover_url)}`;
            const detailUrl = `/movie/${movie.id}`;
            container.innerHTML += `
                <div class="col-md-3 mb-4">
                    <div class="card movie-card h-100 shadow-sm border-0">
                        <a href="${detailUrl}" class="card-link-block" target="_blank">
                            <div class="position-relative">
                                <img src="${coverFixed}" alt="${movie.number}" onerror="this.src='{{ url_for('static', filename='images/noimage.jpg') }}'">
                                <div class="position-absolute top-0 end-0 d-flex gap-1 m-2">
                                    ${ movie.new_magnets ? '<span class="badge bg-warning text-dark">新种</span>' : (movie.magnets_count > 0 ? '<span class="badge" style="background-color: #32ad76 !important;">含磁链</span>' : '') }
                                    ${ movie.has_cnsub ? '<span class="badge bg-info">中字</span>' : '' }
                                </div>
                            </div>
                            <div class="card-body p-3">
                                <h6 class="card-title text-truncate fw-bold" title="${movie.number}">${movie.number}</h6>
                                <p class="card-text small text-muted mb-2" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; height: 3.0em;" title="${movie.title}">${movie.title}</p>
                                <div class="d-flex justify-content-between mt-2">
                                    <span class="badge bg-light text-dark border">${ movie.release_date ? movie.release_date : '' }</span>
                                    <span class="badge bg-light text-dark border">${ movie.duration ? movie.duration+' 分钟' : '' }</span>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            `;
        });
    }

    // ========== 分页 ==========
    function renderPagination(currentPage, loadedCount) {
        const limit = 24;
        const paginationUl = document.getElementById('paginationList');
        paginationUl.innerHTML = '';

        // 本页不足 limit 条，视为最后一页
        const isLastPage = loadedCount < limit;

        // 首页
        paginationUl.innerHTML += `
            <li class="page-item ${currentPage <= 1 ? 'disabled' : ''}">
                <a class="page-link" href="javascript:void(0)"
                onclick="if(${currentPage} > 1) loadListMovies(1, true)" title="首页">«</a>
            </li>
        `;

        // 上一页
        paginationUl.innerHTML += `
            <li class="page-item ${currentPage <= 1 ? 'disabled' : ''}">
                <a class="page-link" href="javascript:void(0)"
                onclick="if(${currentPage} > 1) loadListMovies(${currentPage - 1}, true)" title="上一页">‹</a>
            </li>
        `;

        // 页码窗口
        const startPage = Math.max(1, currentPage - 2);
        const endPage = isLastPage ? currentPage : currentPage + 2;

        // 左省略号
        if (startPage > 1) {
            paginationUl.innerHTML += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
        }

        for (let i = startPage; i <= endPage; i++) {
            if (i === currentPage) {
                paginationUl.innerHTML += `<li class="page-item active"><span class="page-link">${i}</span></li>`;
            } else {
                paginationUl.innerHTML += `
                    <li class="page-item">
                        <a class="page-link" href="javascript:void(0)" onclick="loadListMovies(${i}, true)">${i}</a>
                    </li>
                `;
            }
        }

        // 右省略号：仅当不是最后一页
        if (!isLastPage) {
            paginationUl.innerHTML += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
        }

        // 下一页
        paginationUl.innerHTML += `
            <li class="page-item ${isLastPage ? 'disabled' : ''}">
                <a class="page-link" href="javascript:void(0)"
                onclick="if(!${isLastPage}) loadListMovies(${currentPage + 1}, true)" title="下一页">›</a>
            </li>
        `;

        // 跳页
        paginationUl.innerHTML += `
            <li class="jump-wrap">
                <input type="number" id="jumpPageInput" value="${currentPage + 1}" min="1" placeholder="页码">
                <button class="jump-btn" onclick="jumpToPage()">跳转</button>
            </li>
        `;

        document.getElementById('pagination').classList.remove('d-none');

        // 跳页输入框绑定回车
        const jumpInput = paginationUl.querySelector('#jumpPageInput');
        if (jumpInput) {
            jumpInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') jumpToPage();
            });
        }
    }

    function jumpToPage() {
        const val = document.getElementById('jumpPageInput').value;
        const p = parseInt(val, 10);
        if (p && p > 0) loadListMovies(p, true);
    }

    function updateCollectButton() {
        const btn = document.getElementById('btnCollectList');
        // 统一基础类名
        btn.className = 'btn btn-collect rounded-pill d-inline-block';
        
        if (isListCollected) {
            btn.classList.add('collected'); // 追加已收藏样式
            btn.innerHTML = '⭐ 已收藏';
        } else {
            btn.innerHTML = '⭐ 收藏';
        }
        btn.classList.remove('d-none'); // 确保显示
    }

    async function toggleCollectList() {
        const btn = document.getElementById('btnCollectList');
        if (btn.disabled) return;
        btn.disabled = true;
        const action = isListCollected ? 'uncollect' : 'collect';

        try {
            const res = await fetch(`/api/list/${currentListId}/collect`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action })
            });
            const data = await res.json();
            if (data.success) {
                isListCollected = !isListCollected;
                updateCollectButton(); // 直接调用统一的 UI 更新函数
            } else {
                alert(data.message || '操作失败');
            }
        } catch (e) {
            alert('网络请求失败：' + e.message);
        } finally {
            btn.disabled = false;
        }
    }

    // ========== 监听筛选和排序变化（自动触发防抖） ==========
    document.addEventListener('DOMContentLoaded', function() {
        // 筛选条件改变
        document.querySelectorAll('.list-filter-radio').forEach(el => {
            el.addEventListener('change', function() {
                const container = document.getElementById('moviesContainer');
                const paginationEl = document.getElementById('pagination');
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary"></div>
                        <p class="mt-2 text-muted">加载中...</p>
                    </div>
                `;
                paginationEl.classList.add('d-none');
                debouncedLoadListMovies();
            });
        });

        // ===== 新增：排序 radio 变化监听 =====
        document.querySelectorAll('.sort-radio').forEach(el => {
            el.addEventListener('change', function() {
                const container = document.getElementById('moviesContainer');
                const paginationEl = document.getElementById('pagination');
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary"></div>
                        <p class="mt-2 text-muted">加载中...</p>
                    </div>
                `;
                paginationEl.classList.add('d-none');
                debouncedLoadListMovies();
            });
        });

        // 启动
        if (initialListId) {
            loadListInfo(initialListId);
        }
    });
</script>
{% endblock %}
