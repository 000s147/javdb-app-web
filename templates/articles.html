{% extends "base.html" %}

{% block title %}AV资讯 - JavDB{% endblock %}

{% block styles %}
    <style>
        .article-card {
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: transform .25s ease, box-shadow .25s ease;
        }
        .article-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-3);
        }
        .article-card img { width: 100%; height: 180px; object-fit: cover; transition: transform .4s ease; }
        .article-card:hover img { transform: scale(1.04); }
        .filter-section {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 .125rem .25rem rgba(0,0,0,.075);
        }
        .article-meta { font-size: 0.85rem; color: #6c757d; }
        .article-title { font-size: 1.1rem; font-weight: 600; }
        .filter-display { 
            font-weight: 500; 
            color: #4f46e5; /* 👈 改为品牌紫蓝 */
        }
        /* ===== 分页容器 ===== */
        #pagination {
            margin-top: 2rem !important;
        }

        #paginationList {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            align-items: center;
        }

        #paginationList .page-item {
            margin: 0;
        }

        #paginationList .page-item .page-link {
            min-width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            margin-left: 0 !important;
            border: 1px solid #e9ecef;
            border-radius: 10px !important;
            background: #fff;
            color: #495057;
            font-weight: 500;
            font-size: 0.9rem;
            line-height: 1;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
            text-decoration: none;
        }

        #paginationList .page-item .page-link:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
            color: #4f46e5;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.12);
        }

        #paginationList .page-item.active .page-link {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
        }

        #paginationList .page-item.disabled .page-link {
            background: #f8f9fa;
            border-color: #f1f3f5;
            color: #adb5bd;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        #paginationList .page-item.disabled .page-link:hover {
            background: #f8f9fa;
            border-color: #f1f3f5;
            color: #adb5bd;
            transform: none;
            box-shadow: none;
        }

        /* ===== 跳页区 ===== */
        #paginationList .jump-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 10px;
        }

        #jumpPageInput {
            width: 64px;
            height: 40px;
            border-radius: 10px !important;
            border: 1px solid #e9ecef !important;
            text-align: center;
            font-weight: 500;
            color: #495057;
            transition: all 0.2s;
            padding: 0 !important;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        #jumpPageInput::-webkit-outer-spin-button,
        #jumpPageInput::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #jumpPageInput:focus {
            border-color: #a5b4fc !important;
            box-shadow: 0 0 0 3px rgba(165, 180, 252, 0.25);
            outline: none;
        }

        #paginationList .jump-btn {
            height: 40px;
            padding: 0 16px;
            border-radius: 10px !important;
            border: 1px solid #c7d2fe;
            background: #fff;
            color: #4f46e5;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            margin-left: 0 !important;
        }

        #paginationList .jump-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
            transform: translateY(-1px);
        }

        /* ===== 小屏适配 ===== */
        @media (max-width: 576px) {
            #paginationList { gap: 4px; }
            #paginationList .page-item .page-link {
                min-width: 34px;
                height: 34px;
                padding: 0 8px;
                font-size: 0.82rem;
            }
            #jumpPageInput,
            #paginationList .jump-btn {
                height: 34px;
            }
            #jumpPageInput { width: 54px; }
        }

                /* ===== 刷新按钮（品牌渐变） ===== */
        .btn-brand {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            border: none !important;
            color: #fff !important;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-brand:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
            color: #fff !important;
        }
        .btn-brand:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }

        /* ===== 清除筛选按钮（灰底，悬停变红） ===== */
        .btn-clear {
            background: #fff !important;
            border: 1px solid #e5e7eb !important;
            color: #6b7280 !important;
            font-weight: 500;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-clear:hover {
            background: #fef2f2 !important;
            border-color: #fecaca !important;
            color: #dc2626 !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.15);
        }
        .btn-clear:active {
            transform: translateY(0);
            box-shadow: none;
        }

        /* ===== loading） ===== */
        .text-primary { color: #4f46e5 !important; }
        .spinner-border.text-primary { color: #667eea !important; }
        
    </style>
{% endblock %}

{% block content %}
    <h1 class="mb-4 text-center">📰 AV资讯</h1>

    <!-- 筛选栏 -->
    <div class="filter-section border">
        <div class="row align-items-center">
            <div class="col-md-8 d-flex align-items-center flex-wrap gap-2">
                <span class="fw-bold text-muted small">筛选：</span>
                <span id="filterDisplay" class="text-muted">全部资讯</span>
            </div>
            <div class="col-md-4 text-end">
                <button class="btn btn-clear btn-sm me-1" id="clearFilterBtn" onclick="clearFilters()" style="display:none;">清除筛选</button>
                <button class="btn btn-brand btn-sm" onclick="loadArticles(1)">刷新</button>
            </div>
        </div>
    </div>

    <!-- 文章列表 -->
    <div class="row" id="articlesContainer"></div>

    <!-- 分页 -->
    <nav aria-label="Page navigation" class="mt-4 d-none" id="pagination">
        <ul class="pagination justify-content-center mb-0" id="paginationList"></ul>
    </nav>
{% endblock %}

{% block scripts %}
<script>
    let currentPage = 1;
    const limit = 12;

    // 从 URL 获取筛选参数
    const urlParams = new URLSearchParams(window.location.search);
    let currentAuthorId = urlParams.get('author_id') || '';
    let currentAuthorName = urlParams.get('author_name') || '';
    let currentCategoryId = urlParams.get('category_id') || '';
    let currentCategoryName = urlParams.get('category_name') || '';

    // 更新筛选显示
    function updateFilterDisplay() {
        const display = document.getElementById('filterDisplay');
        const clearBtn = document.getElementById('clearFilterBtn');
        if (currentAuthorId) {
            display.innerHTML = `作者：<span class="filter-display">${currentAuthorName}</span>`;
            clearBtn.style.display = 'inline-block';
        } else if (currentCategoryId) {
            display.innerHTML = `类别：<span class="filter-display">${currentCategoryName}</span>`;
            clearBtn.style.display = 'inline-block';
        } else {
            display.textContent = '全部资讯';
            clearBtn.style.display = 'none';
        }
    }

    // 清除筛选
    function clearFilters() {
        window.location.href = '/articles';
    }

    // ========== 防抖 ==========
    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }

    // ========== 加载文章列表 ==========
    async function loadArticles(page, scrollToTop = false) {
        currentPage = page;
        const container = document.getElementById('articlesContainer');
        const paginationEl = document.getElementById('pagination');

        container.innerHTML = `
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2 text-muted">加载中...</p>
            </div>
        `;
        paginationEl.classList.add('d-none');

        // 构建请求参数
        let params = new URLSearchParams({ page, limit });
        if (currentAuthorId) params.append('author_id', currentAuthorId);
        if (currentCategoryId) params.append('category_id', currentCategoryId);

        try {
            const res = await fetch(`/api/articles?${params.toString()}`);
            const data = await res.json();
            if (!data.success) throw new Error(data.message || '加载失败');

            const articles = data.data.articles || [];
            renderArticles(articles);
            renderPagination(page, articles.length);   // ← 无条件，内部会 remove('d-none')

            // 更新筛选显示（显示作者或类别名字）
            if (currentAuthorId && articles.length > 0) {
                // 取第一篇文章的作者名字
                const authorName = articles[0].author ? articles[0].author.name : currentAuthorId;
                document.getElementById('filterDisplay').innerHTML = `作者：<span class="filter-display">${authorName}</span>`;
            } else if (currentCategoryId && articles.length > 0) {
                const categoryName = articles[0].category ? articles[0].category.name : currentCategoryId;
                document.getElementById('filterDisplay').innerHTML = `类别：<span class="filter-display">${categoryName}</span>`;
            }

            if (scrollToTop) {
                document.getElementById('articlesContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        } catch (e) {
            container.innerHTML = `
                <div class="col-12 text-center text-danger py-5">
                    加载失败：${e.message}
                    <div><button class="btn btn-primary mt-2" onclick="loadArticles(${currentPage}, true)">重试</button></div>
                </div>
            `;
            paginationEl.classList.add('d-none');   // ← 补上
        }
    }

    // ========== 渲染文章卡片 ==========
    function renderArticles(articles) {
        const container = document.getElementById('articlesContainer');
        container.innerHTML = '';

        articles.forEach(article => {
            const coverFixed = `/api/image?url=${encodeURIComponent(article.cover_url)}`;
            const detailUrl = `/article/${article.id}`;
            const d = new Date(article.released_at);
            const released = d.toLocaleString('sv-SE', {
              timeZone: 'Asia/Shanghai',
            }).slice(0, 16).replace('T', ' ');

            // 构建作者链接和类别链接
            let authorLink = article.author ? `<a href="/articles?author_id=${article.author.id}" class="text-decoration-none text-dark">${article.author.name}</a>` : '未知作者';
            let categoryLink = article.category ? `<a href="/articles?category_id=${article.category.id}" class="text-decoration-none" style="color: #4f46e5; font-weight: 600;">${article.category.name}</a>` : '未分类';

            container.innerHTML += `
                <div class="col-md-4 mb-4">
                    <div class="card article-card h-100 shadow-sm border-0">
                        <a href="${detailUrl}" class="card-link-block">
                            <img src="${coverFixed}" class="card-img-top" alt="${article.title}" onerror="this.src='{{ url_for('static', filename='images/noimage.jpg') }}'">
                            <div class="card-body">
                                <h5 class="article-title text-truncate" title="${article.title}">${article.title}</h5>
                                <div class="article-meta mb-2">
                                    <span class="badge" style="background-color: #f5f6ff; border: 1px solid #c7d2fe; padding: 4px 8px;">${categoryLink}</span>
                                    <span class="ms-2">${authorLink}</span>
                                    <span class="ms-2">${released}</span>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            `;
        });
    }

    // ========== 分页 ==========
    function renderPagination(currentPage, loadedCount) {
        const paginationUl = document.getElementById('paginationList');
        paginationUl.innerHTML = '';

        // 本页不足 limit 条，视为最后一页（limit 是本页的 12）
        const isLastPage = loadedCount < limit;

        // 首页
        paginationUl.innerHTML += `
            <li class="page-item ${currentPage <= 1 ? 'disabled' : ''}">
                <a class="page-link" href="javascript:void(0)"
                onclick="if(${currentPage} > 1) loadArticles(1, true)" title="首页">«</a>
            </li>
        `;

        // 上一页
        paginationUl.innerHTML += `
            <li class="page-item ${currentPage <= 1 ? 'disabled' : ''}">
                <a class="page-link" href="javascript:void(0)"
                onclick="if(${currentPage} > 1) loadArticles(${currentPage - 1}, true)" title="上一页">‹</a>
            </li>
        `;

        // 页码窗口
        const startPage = Math.max(1, currentPage - 2);
        const endPage = isLastPage ? currentPage : currentPage + 2;

        // 左省略号
        if (startPage > 1) {
            paginationUl.innerHTML += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
        }

        for (let i = startPage; i <= endPage; i++) {
            if (i === currentPage) {
                paginationUl.innerHTML += `<li class="page-item active"><span class="page-link">${i}</span></li>`;
            } else {
                paginationUl.innerHTML += `
                    <li class="page-item">
                        <a class="page-link" href="javascript:void(0)" onclick="loadArticles(${i}, true)">${i}</a>
                    </li>
                `;
            }
        }

        // 右省略号：仅当不是最后一页
        if (!isLastPage) {
            paginationUl.innerHTML += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
        }

        // 下一页
        paginationUl.innerHTML += `
            <li class="page-item ${isLastPage ? 'disabled' : ''}">
                <a class="page-link" href="javascript:void(0)"
                onclick="if(!${isLastPage}) loadArticles(${currentPage + 1}, true)" title="下一页">›</a>
            </li>
        `;

        // 跳页
        paginationUl.innerHTML += `
            <li class="jump-wrap">
                <input type="number" id="jumpPageInput" value="${currentPage + 1}" min="1" placeholder="页码">
                <button class="jump-btn" onclick="jumpToPage()">跳转</button>
            </li>
        `;

        document.getElementById('pagination').classList.remove('d-none');

        // 给当前渲染的跳页输入框绑定回车
        const jumpInput = paginationUl.querySelector('#jumpPageInput');
        if (jumpInput) {
            jumpInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    jumpToPage();
                }
            });
        }
    }

    function jumpToPage() {
        const val = document.getElementById('jumpPageInput').value;
        const p = parseInt(val, 10);
        if (p && p > 0) loadArticles(p, true);
    }

    // ========== 初始化 ==========
    document.addEventListener('DOMContentLoaded', function() {
        updateFilterDisplay();
        loadArticles(1);
    });
</script>
{% endblock %}
