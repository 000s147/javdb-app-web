{% extends "base.html" %}

{% block title %}排行榜 - JavDB{% endblock %}

{% block styles %}
    <style>
        .movie-card, .actor-card { transition: transform 0.2s; }
        .movie-card:hover, .actor-card:hover { transform: scale(1.02); }
        .movie-card img { width: 100%; height: 220px; object-fit: cover; }

        .actor-avatar-wrapper {
            width: 120px;
            height: 120px;
            margin: 20px auto 10px auto;
            overflow: hidden;
            border-radius: 50%;
            border: 3px solid #f8f9fa;
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.1);
        }
        .actor-avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .filter-section {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 .125rem .25rem rgba(0,0,0,.075);
        }
    </style>
{% endblock %}

{% block content %}
    <h1 class="mb-4 text-center">🚀 排行榜</h1>

    <div class="filter-section border">
        <div class="row align-items-center g-2 mb-2 pb-2 border-bottom">
            <div class="col-12 d-flex align-items-center flex-wrap gap-2">
                <span class="fw-bold text-danger me-1 small">⭐ 类别：</span>

                <input type="radio" class="btn-check type-btn" name="reqType" id="t_0" value="0" checked>
                <label class="btn btn-outline-danger btn-sm" for="t_0">有码</label>

                <input type="radio" class="btn-check type-btn" name="reqType" id="t_1" value="1">
                <label class="btn btn-outline-danger btn-sm" for="t_1">无码</label>

                <input type="radio" class="btn-check type-btn" name="reqType" id="t_2" value="2">
                <label class="btn btn-outline-danger btn-sm" for="t_2">欧美</label>

                <input type="radio" class="btn-check type-btn" name="reqType" id="t_3" value="3">
                <label class="btn btn-outline-danger btn-sm" for="t_3">FC2</label>
            </div>
        </div>

        <div class="row align-items-center g-2">
            <div class="col-12 d-flex align-items-center flex-wrap gap-2">
                <span class="fw-bold text-primary me-1 small">📅 周期：</span>

                <input type="radio" class="btn-check period-btn" name="periodType" id="p_daily" value="daily" checked>
                <label class="btn btn-outline-primary btn-sm" for="p_daily">☀️ 作品日榜</label>

                <input type="radio" class="btn-check period-btn" name="periodType" id="p_weekly" value="weekly">
                <label class="btn btn-outline-primary btn-sm" for="p_weekly">📅 作品周榜</label>

                <input type="radio" class="btn-check period-btn" name="periodType" id="p_monthly" value="monthly">
                <label class="btn btn-outline-primary btn-sm" for="p_monthly">🌙 作品月榜</label>

                <div id="actorRankContainer">
                    <input type="radio" class="btn-check period-btn" name="periodType" id="p_actor" value="actor_monthly">
                    <label class="btn btn-outline-success btn-sm" for="p_actor">👩‍🎤 演员月榜</label>
                </div>
            </div>
        </div>
    </div>

    <div class="row" id="moviesContainerLoading"></div>

    <div class="row" id="moviesContainer"></div>
{% endblock %}

{% block scripts %}
    <script>
        // 利用 Jinja2 获取本地静态图片的真实路径
        const NO_AVATAR_URL = "{{ url_for('static', filename='images/female-avatar.jpg') }}";
        const NO_IMAGE_URL = "{{ url_for('static', filename='images/noimage.jpg') }}";

        // 监听类别和周期的切换事件
        document.querySelectorAll('.type-btn, .period-btn').forEach(btn => {
            btn.addEventListener('change', handleFilterChange);
        });

        // 核心联动逻辑：处理 FC2 隐藏演员榜
        function handleFilterChange(e) {
            const reqType = document.querySelector('input[name="reqType"]:checked').value;
            const actorContainer = document.getElementById('actorRankContainer');
            const actorRadio = document.getElementById('p_actor');
            const dailyRadio = document.getElementById('p_daily');

            if (reqType === '3') {
                actorContainer.classList.add('d-none');
                if (actorRadio.checked) {
                    dailyRadio.checked = true;
                }
            } else {
                actorContainer.classList.remove('d-none');
            }
            fetchRankings();
        }

        // 请求接口获取数据
        async function fetchRankings() {
            const period = document.querySelector('input[name="periodType"]:checked').value;
            const reqType = document.querySelector('input[name="reqType"]:checked').value;
            const containerLD = document.getElementById('moviesContainerLoading');
            const container = document.getElementById('moviesContainer');

            containerLD.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">加载中...</p></div>';
            containerLD.classList.remove('d-none');

            try {
                const res = await fetch(`/api/rankings?period=${period}&type=${reqType}`);
                const data = await res.json();

                if (!data.success) throw new Error(data.error || '获取排行数据失败');

                const items = data.data.movies || data.data.actors || data.data || [];

                if (period === 'actor_monthly') {
                    renderActorCards(items);
                } else {
                    renderMovieCards(items);
                }

                fadeOut(containerLD);

            } catch (err) {
                // ---- 错误展示带重试按钮 ----
                container.innerHTML = `
                    <div class="col-12 text-center text-danger py-5">
                        数据加载失败：${err.message}
                        <div><button class="btn btn-primary mt-2" onclick="fetchRankings()">重试</button></div>
                    </div>
                `;
                fadeOut(containerLD);
            }
        }

        // 渲染影片排行卡片
        function renderMovieCards(movies) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';

            if (movies.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-5">该榜单暂无作品数据</div>';
                return;
            }

            movies.forEach((movie, index) => {
                // 严谨校验影片封面，如果为 null 则直接使用本地默认图
                const rawUrl = movie.cover_url || movie.thumb_url;
                const isValidUrl = rawUrl && rawUrl !== 'null' && rawUrl !== '';
                const coverFixed = isValidUrl ? `/api/image_proxy?url=${encodeURIComponent(rawUrl)}` : NO_IMAGE_URL;

                const detailUrl = `/movie/${movie.id}`;

                // 注意这里的 <img> 加入了 data-type="movie" 和双重 onerror 兜底
                container.innerHTML += `
                    <div class="col-md-3 mb-4">
                        <div class="card movie-card h-100 shadow-sm border-0 position-relative">
                            <a href="${detailUrl}" class="card-link-block" target="_blank">
                                <div class="position-relative">
                                    <img src="${coverFixed}" data-type="movie" alt="${movie.number || ''}" onerror="this.src='${NO_IMAGE_URL}';">
                                    <div class="position-absolute top-0 end-0 d-flex gap-1 m-2">
                                        ${ movie.new_magnets ? '<span class="badge bg-warning text-dark">新种</span>' : (movie.magnets_count > 0 ? '<span class="badge" style="background-color: #32ad76 !important;">含磁链</span>' : '') }
                                        ${ movie.has_cnsub ? '<span class="badge bg-info">中字</span>' : '' }
                                    </div>
                                </div>
                                <div class="card-body p-3">
                                    <h6 class="card-title text-truncate fw-bold mb-1" title="${movie.number || ''}">${movie.number || 'INFO'}</h6>
                                    <p class="card-text small text-muted mb-2" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;" title="${movie.title || ''}">${movie.title || ''}</p>
                                    <div class="d-flex justify-content-between">
                                        <span class="badge bg-light text-dark border">${ movie.release_date ? movie.release_date : '' }</span>
                                        <span class="badge bg-light text-dark border">${ movie.duration ? movie.duration+' 分钟' : '' }</span>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // 渲染演员排行卡片
        function renderActorCards(actors) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';

            if (actors.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-5">该榜单暂无女优数据</div>';
                return;
            }

            actors.forEach((actor, index) => {
                // 严谨校验演员头像，如果为 null 则直接使用本地无头像图片
                const isValidUrl = actor.avatar_url && actor.avatar_url !== 'null' && actor.avatar_url !== '';
                const avatarFixed = isValidUrl ? `/api/image_proxy?url=${encodeURIComponent(actor.avatar_url)}` : NO_AVATAR_URL;

                const actorWorksUrl = `/actor/${actor.id}`;

                // 注意这里的 <img> 加入了 data-type="avatar" 和双重 onerror 兜底
                container.innerHTML += `
                    <div class="col-6 col-md-2 mb-4">
                        <div class="card actor-card h-100 shadow-sm border-0 text-center p-2">
                            <a href="${actorWorksUrl}" class="card-link-block">
                                <div class="actor-avatar-wrapper">
                                    <img src="${avatarFixed}" data-type="avatar" alt="${actor.name}" onerror="this.src='${NO_AVATAR_URL}';">
                                </div>
                                <div class="card-body p-2">
                                    <h6 class="card-title fw-bold text-truncate mb-1">${actor.name}</h6>
                                    <p class="text-muted small text-truncate mb-2" style="min-height: 18px;" title="${actor.other_name || ''}">
                                        ${actor.other_name ? actor.other_name : '&nbsp;'}
                                    </p>
                                </div>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // ==========================================
        // 渐隐隐藏元素函数
        // ==========================================
        function fadeOut(element, duration = 1000) {
            if (!element) return;

            // 1. 设置过渡动画和目标透明度为 0
            element.style.transition = `opacity ${duration}ms ease`;
            element.style.opacity = '0';

            // 2. 等待动画结束 (300ms) 后，加上 d-none 彻底隐藏，并重置 inline 样式
            setTimeout(() => {
                element.classList.add('d-none');
                element.style.opacity = '';
                element.style.transition = '';
            }, duration);
        }

        // 初始化加载默认数据
        window.onload = () => fetchRankings();
    </script>
{% endblock %}
