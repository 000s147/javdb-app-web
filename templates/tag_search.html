{% extends "base.html" %}

{% block title %}类别 - JavDB{% endblock %}

{% block styles %}
    <style>
        .movie-card { transition: transform 0.2s; }
        .movie-card:hover { transform: scale(1.02); }
        .movie-card img { width: 100%; height: 220px; object-fit: cover; }
        .filter-section {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 .125rem .25rem rgba(0,0,0,.075);
        }
        .tag-checkbox {
            display: inline-block;
            margin-bottom: 4px;
        }
        .tag-checkbox input[type="checkbox"] {
            display: none;  /* 完全隐藏复选框 */
        }
        .tag-checkbox label {
            display: inline-block;
            padding: 0.375rem 0.75rem;
            border: 1px solid #dee2e6 !important;
            border-radius: 0.375rem !important;        /* 小圆角，更像按钮 */
            background-color: #f8f9fa !important;
            color: #212529 !important;
            font-size: 0.9rem;
            line-height: 1.5;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            text-align: center;
            white-space: nowrap;
        }
        /* 未选中悬停 */
        .tag-checkbox input[type="checkbox"]:not(:checked) + label:hover {
            background-color: #e9ecef !important;
            border-color: #b6b9bc !important;
        }
        /* 选中状态 */
        .tag-checkbox input[type="checkbox"]:checked + label {
            background-color: #0d6efd !important;
            color: #fff !important;
            border-color: #0d6efd !important;
        }
        /* 选中悬停 */
        .tag-checkbox input[type="checkbox"]:checked + label:hover {
            background-color: #0b5ed7 !important;
            border-color: #0a58ca !important;
        }
        /* 禁用状态（超过5个时自动禁用） */
        .tag-checkbox input[type="checkbox"]:disabled + label {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        /* 点击下沉效果（可选） */
        .tag-checkbox label:active {
            transform: scale(0.96);
        }
        .group-title {
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 8px;
            color: #0d6efd;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 4px;
        }
        .badge-count {
            background: #e9ecef;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        /* 统一年份和排序单选按钮样式，使其与类别标签风格一致 */
        .custom-radio-label {
            border: 1px solid #dee2e6 !important;
            border-radius: 0.375rem !important;
            padding: 0.375rem 0.75rem;
            background-color: #f8f9fa !important;
            color: #212529 !important;
            margin-bottom: 4px;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        /* 鼠标悬停效果 */
        .btn-check:not(:checked) + .custom-radio-label:hover {
            background-color: #e9ecef !important;
        }
        /* 选中时的效果 */
        .btn-check:checked + .custom-radio-label {
            background-color: #0d6efd !important;
            color: #fff !important;
            border-color: #0d6efd !important;
        }
    </style>
{% endblock %}

{% block content %}
    <h1 class="mb-4 text-center">🏷️ 类别</h1>
    <p class="text-center text-muted">选择类别（最多 5 个），可叠加年份 / 月份筛选</p>

    <!-- 筛选卡片 -->
    <div class="filter-section border">
        <div class="row align-items-center mb-3 pb-1">
            <div class="col-12 d-flex align-items-center gap-2">
                <div style="width: 100%;">
                    <h6 class="group-title">类别</h6>
                    <div class="d-flex flex-wrap gap-2">
                        <input type="radio" class="btn-check type-btn" name="reqType" id="t_0" value="0" checked>
                        <label class="btn custom-radio-label btn-sm" for="t_0">有码</label>

                        <input type="radio" class="btn-check type-btn" name="reqType" id="t_1" value="1">
                        <label class="btn custom-radio-label btn-sm" for="t_1">无码</label>

                        <input type="radio" class="btn-check type-btn" name="reqType" id="t_2" value="2">
                        <label class="btn custom-radio-label btn-sm" for="t_2">欧美</label>

                        <input type="radio" class="btn-check type-btn" name="reqType" id="t_3" value="3">
                        <label class="btn custom-radio-label btn-sm" for="t_3">FC2</label>

                        <input type="radio" class="btn-check type-btn" name="reqType" id="t_4" value="4">
                        <label class="btn custom-radio-label btn-sm" for="t_4">动漫</label>
                    </div>
                </div>
            </div>
        </div>

        <div id="tagGroupsContainer"></div>

        <h6 class="group-title">年份:</h6>
        <div id="yearContainer" class="d-flex flex-wrap gap-2 mb-3">
            <!-- 年份按钮由 JS 动态生成 -->
        </div>

        <h6 class="group-title">月份:</h6>
        <div id="monthContainer" class="d-flex flex-wrap gap-2 mb-3">
            <!-- 月份按钮由 JS 动态生成 -->
        </div>

        <h6 class="group-title">排序:</h6>
        <div id="sortContainer" class="d-flex flex-wrap gap-2 mb-4">
            <input type="radio" class="btn-check sort-radio" name="sortOption" id="sort_update" value="update|asc">
            <label class="btn custom-radio-label btn-sm" for="sort_update">更新时间倒序</label>

            <input type="radio" class="btn-check sort-radio" name="sortOption" id="sort_release_desc" value="release|desc" checked>
            <label class="btn custom-radio-label btn-sm" for="sort_release_desc">发布时间倒序</label>

            <input type="radio" class="btn-check sort-radio" name="sortOption" id="sort_release_asc" value="release|asc">
            <label class="btn custom-radio-label btn-sm" for="sort_release_asc">发布时间正序</label>

            <input type="radio" class="btn-check sort-radio" name="sortOption" id="sort_score" value="score|asc">
            <label class="btn custom-radio-label btn-sm" for="sort_score">评分倒序</label>

            <input type="radio" class="btn-check sort-radio" name="sortOption" id="sort_hit" value="hit|asc">
            <label class="btn custom-radio-label btn-sm" for="sort_hit">热度倒序</label>

            <input type="radio" class="btn-check sort-radio" name="sortOption" id="sort_want" value="want_watch_count|asc">
            <label class="btn custom-radio-label btn-sm" for="sort_want">想看人数倒序</label>

            <input type="radio" class="btn-check sort-radio" name="sortOption" id="sort_watched" value="watched_count|asc">
            <label class="btn custom-radio-label btn-sm" for="sort_watched">看过人数倒序</label>
        </div>

        <div class="row align-items-center">
            <div class="col-md-6 mb-2">
                <strong>已选标签：</strong><span id="selectedCountDisplay">0</span> / 5
            </div>
            <div class="col-md-6 mb-2 text-end gap-2">
                <button class="btn btn-outline-secondary btn-sm px-3 me-1" style="border-radius: 0.375rem;" onclick="resetSelection()">🗑️ 清空</button>
                <button class="btn btn-primary btn-sm px-4" style="border-radius: 0.375rem;" onclick="searchMovies(1)">🔍 搜索</button>
            </div>
        </div>
    </div>

    <div class="row g-3" id="moviesContainerLoading"></div>

    <!-- 影片列表 -->
    <div class="row g-3" id="moviesContainer"></div>

    <!-- 分页 -->
    <nav aria-label="Page navigation" class="mt-4 d-none" id="pagination">
        <ul class="pagination justify-content-center mb-0" id="paginationList"></ul>
    </nav>
{% endblock %}

{% block scripts %}
    <script>
        // ========== 全局状态 ==========
        let allTags = [];
        let selectedTags = new Set();
        let tagNameCache = {};   // 新增
        const MAX_TAGS = 5;
        let currentPage = 1;
        let urlProcessed = false;   // 防止重复处理 URL 参数

        // ========== 防抖 ==========
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    func.apply(this, args);
                }, wait);
            };
        }
        const debouncedSearchMovies = debounce(() => searchMovies(1), 200);

        // ========== 加载标签数据 ==========
        async function loadTags(autoSearch = true) {
            tagNameCache = {};   // 清空旧缓存
            const urlParams = new URLSearchParams(window.location.search);

            // 处理 type 参数（原有）
            if (!urlProcessed) {
                const typeParam = urlParams.get('type');
                if (typeParam !== null) {
                    const radio = document.querySelector(`.type-btn[value="${typeParam}"]`);
                    if (radio) radio.checked = true;
                }
            }

            try {
                const reqType = document.querySelector('input[name="reqType"]:checked').value;
                const res = await fetch(`/api/tags?type=${reqType}`);
                const data = await res.json();
                if (!data.success) throw new Error(data.message || '获取标签失败');

                allTags = data.data.tags.filter(group =>
                    group.category_id !== 'year' && group.category_id !== 'month'
                );
                renderTagGroups();

                // ========== 读取 year / month / sort ==========
                let pageParam = 1;   // 新增：默认第1页
                if (!urlProcessed) {
                    const yearParam = urlParams.get('year');
                    if (yearParam) {
                        const yearRadio = document.getElementById(`year_${yearParam}`);
                        if (yearRadio) yearRadio.checked = true;
                    }

                    const monthParam = urlParams.get('month');
                    if (monthParam) {
                        const monthRadio = document.getElementById(`month_${monthParam}`);
                        if (monthRadio) monthRadio.checked = true;
                    }

                    const sortParam = urlParams.get('sort');
                    if (sortParam) {
                        const sortRadio = document.querySelector(`.sort-radio[value="${sortParam}"]`);
                        if (sortRadio) sortRadio.checked = true;
                    }

                    // ========== 新增：读取页码 ==========
                    const pageFromUrl = urlParams.get('page');
                    if (pageFromUrl) {
                        const parsed = parseInt(pageFromUrl, 10);
                        if (!isNaN(parsed) && parsed > 0) pageParam = parsed;
                    }
                    // =====================================
                }
                // =================================================

                // 处理 tags 参数（原有，用于勾选标签）
                if (!urlProcessed) {
                    const tagsParam = urlParams.get('tags');
                    const tagNamesParam = urlParams.get('tag_names');

                    if (tagsParam) {
                        const ids = tagsParam.split(',').map(id => id.trim());
                        const names = tagNamesParam ? tagNamesParam.split(',').map(name => name.trim()) : [];

                        // 填充缓存
                        ids.forEach((id, index) => {
                            if (id) {
                                const name = names[index] || `标签${id}`;
                                tagNameCache[id] = name;
                            }
                        });

                        await new Promise(resolve => setTimeout(resolve, 50));

                        let hasHiddenTags = false;
                        let hiddenTagsHtml = '';

                        ids.forEach((id, index) => {
                            if (!id) return;
                            selectedTags.add(id);
                            const existingCb = document.querySelector(`.tag-check[value="${id}"]`);
                            if (existingCb) {
                                existingCb.checked = true;
                            } else {
                                hasHiddenTags = true;
                                const currentTagName = names[index] || `未命名标签(${id})`;
                                hiddenTagsHtml += `
                                    <div class="tag-checkbox">
                                        <input class="tag-check custom-tag" type="checkbox" value="${id}" id="tag_hidden_${id}" checked>
                                        <label for="tag_hidden_${id}">${currentTagName}</label>
                                    </div>
                                `;
                            }
                        });

                        if (hasHiddenTags) {
                            const container = document.getElementById('tagGroupsContainer');
                            const customGroupDiv = document.createElement('div');
                            customGroupDiv.id = 'hiddenTagsWrapper';
                            customGroupDiv.className = 'mb-3';
                            customGroupDiv.innerHTML = `
                                <h6 class="group-title" style="color: #ff9800; border-bottom-color: #ff9800;">📌 当前筛选的隐藏标签</h6>
                                <div class="mb-3 d-flex flex-wrap gap-2">${hiddenTagsHtml}</div>
                            `;
                            container.insertBefore(customGroupDiv, container.firstChild);
                            customGroupDiv.querySelectorAll('.tag-check').forEach(cb => {
                                cb.addEventListener('change', onTagChange);
                            });
                        }

                        updateSelectionUI();
                        urlProcessed = true;
                        // ========== 修改：使用 pageParam ==========
                        await searchMovies(pageParam);
                        // ======================================
                        return;
                    }
                    urlProcessed = true;
                }

                if (autoSearch) {
                    // ========== 修改：使用 pageParam ==========
                    await searchMovies(pageParam);
                    // ======================================
                }
            } catch (e) {
                const container = document.getElementById('tagGroupsContainer');
                container.innerHTML = `
                    <div class="alert alert-danger">
                        加载标签失败：${e.message}
                        <button class="btn btn-sm btn-primary ms-2" onclick="loadTags(true)">重试</button>
                    </div>
                `;
                document.title = '加载标签失败 - JavDB';
                const containerLD = document.getElementById('moviesContainerLoading');
                containerLD.innerHTML = '';
                containerLD.classList.add('d-none');
                document.getElementById('moviesContainer').innerHTML = '';
            }
        }

        // ========== 渲染标签分组 ==========
        function renderTagGroups() {
            const container = document.getElementById('tagGroupsContainer');
            container.innerHTML = '';

            allTags.forEach(group => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'mb-3';

                const title = document.createElement('h6');
                title.className = 'group-title';
                title.innerText = group.category;
                groupDiv.appendChild(title);

                const wrap = document.createElement('div');
                wrap.className = 'mb-3 d-flex flex-wrap gap-2';

                group.tags.forEach(tag => {
                    const id = `tag_${tag.id}`;
                    const div = document.createElement('div');
                    div.className = 'tag-checkbox';   // 仅保留自定义容器

                    const input = document.createElement('input');
                    input.className = 'tag-check';    // 保留用于事件监听
                    input.type = 'checkbox';
                    input.value = tag.id;
                    input.id = id;
                    input.dataset.category = group.category_id;

                    const label = document.createElement('label');
                    label.htmlFor = id;
                    label.innerText = tag.name;
                    label.className = 'btn custom-radio-label btn-sm'; // 加上与类别按钮完全相同的基础类

                    div.appendChild(input);
                    div.appendChild(label);
                    wrap.appendChild(div);
                });

                groupDiv.appendChild(wrap);
                container.appendChild(groupDiv);
            });

            document.querySelectorAll('.tag-check').forEach(cb => {
                cb.addEventListener('change', onTagChange);
            });

            updateSelectionUI();
        }

        // ========== 标签选择事件 ==========
        function onTagChange(e) {
            const cb = e.target;
            const tagId = cb.value;

            if (cb.checked) {
                if (selectedTags.size >= MAX_TAGS) {
                    alert(`最多只能选择 ${MAX_TAGS} 个标签`);
                    cb.checked = false;
                    return;
                }
                selectedTags.add(tagId);
            } else {
                selectedTags.delete(tagId);
            }
            updateSelectionUI();

            // 👇 立即显示 Loading（但不发请求）
            const containerLD = document.getElementById('moviesContainerLoading');
            const paginationEl = document.getElementById('pagination');
            containerLD.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary"></div>
                    <p class="mt-2 text-muted">加载中...</p>
                </div>
            `;
            containerLD.classList.remove('d-none');
            paginationEl.classList.add('d-none');

            debouncedSearchMovies();
        }

        // ========== 更新界面 ==========
        function updateSelectionUI() {
            const count = selectedTags.size;
            document.getElementById('selectedCountDisplay').innerText = count;

            const allCbs = document.querySelectorAll('.tag-check');
            const isFull = count >= MAX_TAGS;
            allCbs.forEach(cb => {
                if (!cb.checked) {
                    cb.disabled = isFull;
                } else {
                    cb.disabled = false;
                }
            });
        }

        // ========== 清空选择 ==========
        function resetSelection() {
            document.querySelectorAll('.tag-check:checked').forEach(cb => cb.checked = false);
            selectedTags.clear();

            document.getElementById('year_all').checked = true;
            document.getElementById('month_all').checked = true;
            document.getElementById('sort_release_desc').checked = true;

            currentPage = 1;              // 重置页码
            updateUrlParams();            // 更新 URL（page=1 会被省略，因为 >1 才显示）

            updateSelectionUI();

            const containerLD = document.getElementById('moviesContainerLoading');
            const paginationEl = document.getElementById('pagination');
            containerLD.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary"></div>
                    <p class="mt-2 text-muted">加载中...</p>
                </div>
            `;
            containerLD.classList.remove('d-none');
            paginationEl.classList.add('d-none');

            debouncedSearchMovies();
        }

        // ========== 填充年份按钮 ==========
        function populateYears() {
            const container = document.getElementById('yearContainer');
            const currentYear = new Date().getFullYear();
            let html = `
                <input type="radio" class="btn-check year-radio" name="yearOption" id="year_all" value="" checked>
                <label class="btn custom-radio-label btn-sm rounded-pill" for="year_all">全部</label>
            `;
            for (let y = currentYear; y >= 2000; y--) {
                html += `
                    <input type="radio" class="btn-check year-radio" name="yearOption" id="year_${y}" value="${y}">
                    <label class="btn custom-radio-label btn-sm rounded-pill" for="year_${y}">${y}</label>
                `;
            }
            container.innerHTML = html;
        }

        // ========== 填充月份按钮 ==========
        function populateMonths() {
            const container = document.getElementById('monthContainer');
            let html = `
                <input type="radio" class="btn-check month-radio" name="monthOption" id="month_all" value="" checked>
                <label class="btn custom-radio-label btn-sm rounded-pill" for="month_all">全部</label>
            `;
            for (let m = 1; m <= 12; m++) {
                html += `
                    <input type="radio" class="btn-check month-radio" name="monthOption" id="month_${m}" value="${m}">
                    <label class="btn custom-radio-label btn-sm rounded-pill" for="month_${m}">${m}月</label>
                `;
            }
            container.innerHTML = html;
        }

        // ========== 搜索影片 ==========
        async function searchMovies(page, scrollToTop = false) {
            currentPage = page;          // 先更新当前页码
            updateUrlParams();           // 再同步 URL（此时 currentPage 已为新值）

            const containerLD = document.getElementById('moviesContainerLoading');
            const container = document.getElementById('moviesContainer');
            const paginationEl = document.getElementById('pagination');

            containerLD.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary"></div>
                    <p class="mt-2 text-muted">加载中...</p>
                </div>
            `;
            containerLD.classList.remove('d-none');
            paginationEl.classList.add('d-none');

            if (scrollToTop) {
                document.getElementById('moviesContainerLoading').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            const selectedIds = Array.from(selectedTags);
            const categoryMap = {};
            allTags.forEach(group => {
                group.tags.forEach(t => {
                    categoryMap[t.id] = group.category_id;
                });
            });

            let mainIds = [], otherIds = [], durationIds = [];
            selectedIds.forEach(id => {
                const cat = categoryMap[id];
                if (cat === 'main') mainIds.push(id);
                else if (cat === 'duration') durationIds.push(id);
                else otherIds.push(id);
            });

            const baseStr = mainIds.join(',');
            const otherStr = otherIds.join(',');
            const durationStr = durationIds.join(',');
            const reqType = document.querySelector('input[name="reqType"]:checked').value;
            const monthVal = document.querySelector('input[name="monthOption"]:checked').value;
            const sortOption = document.querySelector('input[name="sortOption"]:checked').value;
            const [sort_by, order_by] = sortOption.split('|');

            const params = new URLSearchParams({
                type: reqType,
                base_tags: baseStr,
                other_tags: otherStr,
                duration_tags: durationStr,
                year: document.querySelector('input[name="yearOption"]:checked').value,
                month: monthVal,
                sort_by: sort_by,
                order_by: order_by,
                page: page,
                limit: 24
            });

            try {
                const res = await fetch('/api/tag-movies?' + params.toString());
                const data = await res.json();
                if (!data.success) throw new Error(data.message || '搜索失败');

                renderMovies(data.data.movies);
                renderPagination(page, data.data.movies.length);
                fadeOut(containerLD);

            } catch (e) {
                container.innerHTML = `
                    <div class="col-12 text-center text-danger py-5">
                        加载失败：${e.message}
                        <div><button class="btn btn-primary mt-2" onclick="searchMovies(${page})">重试</button></div>
                    </div>
                `;
                fadeOut(containerLD);
                document.getElementById('pagination').classList.add('d-none');
            }
        }

        // ========== 渲染影片卡片 ==========
        function renderMovies(movies) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';

            if (!movies || movies.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-5">未找到符合条件的影片</div>';
                return;
            }

            movies.forEach(movie => {
                const coverFixed = `/api/image_proxy?url=${encodeURIComponent(movie.cover_url)}`;
                const detailUrl = `/movie/${movie.id}`;

                container.innerHTML += `
                    <div class="col-md-3 mb-4">
                        <div class="card movie-card h-100 shadow-sm border-0">
                            <a href="${detailUrl}" class="card-link-block" target="_blank">
                                <div class="position-relative">
                                    <img src="${coverFixed}" alt="${movie.number}" onerror="this.src='{{ url_for('static', filename='images/noimage.jpg') }}'">
                                    <div class="position-absolute top-0 end-0 d-flex gap-1 m-2">
                                        ${ movie.new_magnets ? '<span class="badge bg-warning text-dark">新种</span>' : (movie.magnets_count > 0 ? '<span class="badge" style="background-color: #32ad76 !important;">含磁链</span>' : '') }
                                        ${ movie.has_cnsub ? '<span class="badge bg-info">中字</span>' : '' }
                                    </div>
                                </div>
                                <div class="card-body p-3">
                                    <h6 class="card-title text-truncate fw-bold" title="${movie.number}">${movie.number}</h6>
                                    <p class="card-text small text-muted mb-2" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; height: 3.0em;" title="${movie.title}">${movie.title}</p>
                                    <div class="d-flex justify-content-between mt-2">
                                        <span class="badge bg-light text-dark border">${ movie.release_date ? movie.release_date : '' }</span>
                                        <span class="badge bg-light text-dark border">${ movie.duration ? movie.duration+' 分钟' : '' }</span>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // ========== 分页 ==========
        function renderPagination(currentPage, loadedCount) {
            const limit = 24;
            const paginationUl = document.getElementById('paginationList');
            paginationUl.innerHTML = '';
            const isLastPage = loadedCount < limit;

            const prevDisabled = currentPage <= 1 ? 'disabled' : '';
            paginationUl.innerHTML += `
                <li class="page-item ${prevDisabled}">
                    <a class="page-link" href="javascript:void(0)" onclick="if(${currentPage} > 1) searchMovies(${currentPage - 1}, true)">上一页</a>
                </li>
            `;

            let startPage = Math.max(1, currentPage - 2);
            let endPage = isLastPage ? currentPage : currentPage + 2;

            for (let i = startPage; i <= endPage; i++) {
                if (i === currentPage) {
                    paginationUl.innerHTML += `<li class="page-item active"><span class="page-link">${i}</span></li>`;
                } else {
                    paginationUl.innerHTML += `<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="searchMovies(${i}, true)">${i}</a></li>`;
                }
            }

            const nextDisabled = isLastPage ? 'disabled' : '';
            paginationUl.innerHTML += `
                <li class="page-item ${nextDisabled}">
                    <a class="page-link" href="javascript:void(0)" onclick="if(!${isLastPage}) searchMovies(${currentPage + 1}, true)">下一页</a>
                </li>
            `;

            paginationUl.innerHTML += `
                <li class="page-item ms-3 d-flex align-items-center">
                    <input type="number" id="jumpPageInput" class="form-control text-center px-1" style="width: 60px; height: 38px;" value="${currentPage + 1}" min="1">
                    <button class="btn btn-outline-primary ms-1" style="height: 38px;" onclick="jumpToPage()">跳转</button>
                </li>
            `;

            document.getElementById('pagination').classList.remove('d-none');
        }

        function jumpToPage() {
            const val = document.getElementById('jumpPageInput').value;
            const page = parseInt(val, 10);
            if (page && page > 0) searchMovies(page, true);
        }

        // ==========================================
        // 渐隐隐藏元素函数
        // ==========================================
        function fadeOut(element, duration = 1000) {
            if (!element) return;

            // 1. 设置过渡动画和目标透明度为 0
            element.style.transition = `opacity ${duration}ms ease`;
            element.style.opacity = '0';

            // 2. 等待动画结束 (300ms) 后，加上 d-none 彻底隐藏，并重置 inline 样式
            setTimeout(() => {
                element.classList.add('d-none');
                element.style.opacity = '';
                element.style.transition = '';
            }, duration);
        }

        function updateUrlParams() {
            const reqType = document.querySelector('input[name="reqType"]:checked').value;
            const selectedIds = Array.from(selectedTags);
            const year = document.querySelector('input[name="yearOption"]:checked').value;
            const month = document.querySelector('input[name="monthOption"]:checked').value;
            const sort = document.querySelector('input[name="sortOption"]:checked').value;

            const params = new URLSearchParams();
            params.set('type', reqType);
            if (selectedIds.length) params.set('tags', selectedIds.join(','));

            // 收集标签名称（用于隐藏标签显示）
            const tagNames = [];
            selectedIds.forEach(id => {
                let name = tagNameCache[id];
                if (!name) {
                    // 从 allTags 中查找
                    for (const group of allTags) {
                        const found = group.tags.find(t => t.id == id);
                        if (found) {
                            name = found.name;
                            break;
                        }
                    }
                }
                if (!name) name = `标签${id}`;
                tagNames.push(name);   // 注意：不再 encodeURIComponent
            });
            if (tagNames.length) params.set('tag_names', tagNames.join(','));

            if (year) params.set('year', year);
            if (month) params.set('month', month);
            if (sort && sort !== 'release|desc') params.set('sort', sort);

            // ========== 新增：加入页码（仅当 >1） ==========
            if (currentPage > 1) params.set('page', currentPage);
            // =============================================

            const newUrl = window.location.pathname + '?' + params.toString();
            history.replaceState({}, '', newUrl);
        }

        // ========== 初始化 ==========
        window.onload = function() {
            populateYears();
            populateMonths(); // 新增调用

            // 加载标签（内部会处理 URL 参数）
            loadTags();

            // 统一的加载动画触发函数
            const triggerLoadingAndLoad = function() {
                const containerLD = document.getElementById('moviesContainerLoading');
                const paginationEl = document.getElementById('pagination');
                containerLD.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary"></div>
                        <p class="mt-2 text-muted">加载中...</p>
                    </div>
                `;
                containerLD.classList.remove('d-none');
                paginationEl.classList.add('d-none');
                debouncedSearchMovies();
            };

            // 监听筛选按钮的变化（年份、月份、排序）
            document.querySelectorAll('.year-radio, .month-radio, .sort-radio').forEach(radio => {
                radio.addEventListener('change', triggerLoadingAndLoad);
            });

            // 类别切换监听
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.addEventListener('change', function() {
                    // 切换类别时清空所有已选标签
                    selectedTags.clear();

                    document.getElementById('year_all').checked = true;
                    document.getElementById('month_all').checked = true;
                    // 可选：重置排序
                    // document.getElementById('sort_release_desc').checked = true;

                    currentPage = 1;          // 重置页码
                    updateUrlParams();  // 新增

                    updateSelectionUI();

                    // 移除隐藏标签区域
                    const hiddenWrapper = document.getElementById('hiddenTagsWrapper');
                    if (hiddenWrapper) {
                        hiddenWrapper.remove();
                    }

                    const containerLD = document.getElementById('moviesContainerLoading');
                    const paginationEl = document.getElementById('pagination');
                    containerLD.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <div class="spinner-border text-danger"></div>
                            <p class="mt-2 text-muted">正在切换分类...</p>
                        </div>
                    `;
                    containerLD.classList.remove('d-none');
                    paginationEl.classList.add('d-none');

                    // 重新加载标签（自动搜索）
                    loadTags();
                });
            });
        };
    </script>
{% endblock %}
