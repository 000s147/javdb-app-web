{% extends "base.html" %}

{% block title %}加载中...{% endblock %}

{% block styles %}
    <style>
        .movie-card { transition: transform 0.2s; }
        .movie-card:hover { transform: scale(1.02); }
        .movie-card img { width: 100%; height: 220px; object-fit: cover; }
        .filter-section {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 .125rem .25rem rgba(0,0,0,.075);
        }
        .group-title {
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 8px;
            color: #0d6efd;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 4px;
        }
        .filter-radio-group label {
            margin-right: 12px;
        }
        /* 系列信息胶囊标签 */
        #seriesMeta {
            gap: 8px 12px;
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .info-chip {
            display: inline-flex;
            align-items: center;
            background: #f1f3f5;
            padding: 4px 14px 4px 12px;
            border-radius: 30px;
            border: 1px solid #e9ecef;
            color: #212529;
            font-size: 0.85rem;
            line-height: 1.6;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .info-chip .icon {
            margin-right: 6px;
            font-size: 1.1rem;
            line-height: 1;
        }

        /* 排序按钮样式（与演员主页统一） */
        .custom-radio-label {
            border: 1px solid #dee2e6 !important;
            background-color: #f8f9fa !important;
            color: #212529 !important;
            border-radius: 0.375rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .btn-check:not(:checked) + .custom-radio-label:hover {
            background-color: #e9ecef !important;
        }
        .btn-check:checked + .custom-radio-label {
            background-color: #0d6efd !important;
            color: #fff !important;
            border-color: #0d6efd !important;
        }
    </style>
{% endblock %}

{% block content %}
<div id="seriesProfile" class="card mb-4 d-none shadow-sm">
    <div class="card-body">
        <div class="d-flex align-items-center mb-4">
            <div class="me-4">
                <span style="font-size: 3rem;">📁</span>
            </div>
            <div>
                <h2 id="seriesName" class="mb-2 fw-bold"></h2>
                <div class="d-flex align-items-center mb-4">
                    <button id="collectBtn" class="btn btn-outline-danger btn-sm rounded-pill shadow-sm" onclick="toggleCollectSeries()"
                            style="padding-left: 14px; padding-right: 14px; margin-right: 8px; font-size: 0.85rem; margin-top: 6px;">
                        ⭐ 收藏
                    </button>
                    <div id="seriesMeta" class="text-muted d-flex flex-wrap gap-2" style="font-size: 0.95rem;"></div>
                    <div id="seriesType" class="mt-2 text-secondary"></div>
                </div>
            </div>
        </div>

        <!-- ===== 筛选 & 排序区域（两行结构） ===== -->
        <div class="filter-section border shadow-sm mb-4">
            <!-- 第一行：筛选 + 刷新 -->
            <div class="row align-items-center">
                <div class="col-md-10 d-flex flex-wrap gap-2 align-items-center">
                    <span class="fw-bold text-muted small">筛选：</span>

                    <input type="radio" class="btn-check series-filter-radio" name="seriesFilter" id="sf_all" value="" checked>
                    <label class="btn custom-radio-label btn-sm" for="sf_all">全部</label>

                    <input type="radio" class="btn-check series-filter-radio" name="seriesFilter" id="sf_play" value="p">
                    <label class="btn custom-radio-label btn-sm" for="sf_play">可播放</label>

                    <input type="radio" class="btn-check series-filter-radio" name="seriesFilter" id="sf_magnet" value="m">
                    <label class="btn custom-radio-label btn-sm" for="sf_magnet">含磁链</label>

                    <input type="radio" class="btn-check series-filter-radio" name="seriesFilter" id="sf_sub" value="c">
                    <label class="btn custom-radio-label btn-sm" for="sf_sub">含字幕</label>
                </div>
                <div class="col-md-2 text-end">
                    <button class="btn btn-primary btn-sm w-100" style="border-radius: 0.375rem;" onclick="loadSeriesMovies(1)">刷新数据</button>
                </div>
            </div>

            <!-- 第二行：排序（独占整行） -->
            <div class="row">
                <div class="col-12 d-flex flex-wrap align-items-center gap-2 mt-3">
                    <span class="fw-bold text-muted small" style="white-space: nowrap;">排序：</span>

                    <input type="radio" class="btn-check sort-radio" name="seriesSort" id="series_sort_release_desc" value="release|desc" checked>
                    <label class="btn custom-radio-label btn-sm" for="series_sort_release_desc">发布时间倒序</label>

                    <input type="radio" class="btn-check sort-radio" name="seriesSort" id="series_sort_release_asc" value="release|asc">
                    <label class="btn custom-radio-label btn-sm" for="series_sort_release_asc">发布时间正序</label>

                    <input type="radio" class="btn-check sort-radio" name="seriesSort" id="series_sort_score" value="score|asc">
                    <label class="btn custom-radio-label btn-sm" for="series_sort_score">评分倒序</label>

                    <input type="radio" class="btn-check sort-radio" name="seriesSort" id="series_sort_hit" value="hit|asc">
                    <label class="btn custom-radio-label btn-sm" for="series_sort_hit">热度倒序</label>

                    <input type="radio" class="btn-check sort-radio" name="seriesSort" id="series_sort_want" value="want_watch_count|asc">
                    <label class="btn custom-radio-label btn-sm" for="series_sort_want">想看人数倒序</label>

                    <input type="radio" class="btn-check sort-radio" name="seriesSort" id="series_sort_watched" value="watched_count|asc">
                    <label class="btn custom-radio-label btn-sm" for="series_sort_watched">看过人数倒序</label>
                </div>
            </div>
        </div>
        <!-- 系列信息错误容器（默认隐藏） -->
        <div id="seriesInfoError" class="text-danger mt-2" style="display:none;"></div>
    </div>
</div>

<div class="row" id="moviesContainerLoading"></div>

<div class="row" id="moviesContainer"></div>

<nav aria-label="Page navigation" class="mt-4 d-none" id="pagination">
    <ul class="pagination justify-content-center mb-0" id="paginationList"></ul>
</nav>
{% endblock %}

{% block scripts %}
<script>
    const initialSeriesId = '{{ series_id }}';
    let currentSeriesId = '';
    let currentPage = 1;
    let isSeriesCollected = false;

    // ========== 防抖 ==========
    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => { func.apply(this, args); }, wait);
        };
    }
    const debouncedLoadSeriesMovies = debounce(() => loadSeriesMovies(1), 500);

    // ========== 加载系列信息 ==========
    async function loadSeriesInfo(seriesId) {
        const profileDiv = document.getElementById('seriesProfile');
        const nameEl = document.getElementById('seriesName');
        const metaEl = document.getElementById('seriesMeta');
        const typeEl = document.getElementById('seriesType');
        const errorEl = document.getElementById('seriesInfoError');

        try {
            const res = await fetch(`/api/series/${seriesId}`);
            const data = await res.json();
            if (!data.success) throw new Error(data.message || '获取系列信息失败');

            const series = data.data.series;
            currentSeriesId = seriesId;

            // 显示正常信息
            nameEl.innerText = series.name;
            document.title = series.name + ' - 系列 - JavDB';

            // ================= 新增：更新收藏状态 =================
            // 根据 JavDB 格式，通过 has_collected 字段判断是否已收藏
            isSeriesCollected = data.data.has_collected || false;
            updateCollectBtnUI();
            collectBtn.classList.remove('d-none'); // 成功加载后显示按钮
            // ====================================================

            let metaHtml = [];
            metaHtml.push(`<span class="info-chip"><span class="icon">📂</span>作品 ${series.videos_count}</span>`);
            if (series.type !== undefined && series.type !== null) {
                const typeMap = {0:'有码',1:'无码',2:'欧美',3:'FC2',4:'动漫'};
                const typeName = typeMap[series.type] || '未知';
                metaHtml.push(`<span class="info-chip"><span class="icon">🏷️</span>${typeName}</span>`);
            }
            metaEl.innerHTML = metaHtml.join(' ');
            typeEl.innerText = ''; // 清空（如有额外内容）

            // 显示卡片，隐藏错误
            profileDiv.classList.remove('d-none');
            errorEl.style.display = 'none';
            errorEl.innerHTML = '';

            // 加载影片列表
            await loadSeriesMovies(1);
        } catch (e) {
            console.error("加载系列信息失败", e);
            // 显示错误信息，隐藏正常内容
            profileDiv.classList.remove('d-none');
            errorEl.style.display = 'block';
            errorEl.innerHTML = `
                <div class="text-center">
                    加载系列信息失败：${e.message}<br>
                    <button class="btn btn-outline-primary btn-sm mt-2" onclick="loadSeriesInfo('${seriesId}')">重试</button>
                </div>
            `;
            // 清空正常内容
            nameEl.innerText = '';
            metaEl.innerHTML = '';
            typeEl.innerText = '';
            // 隐藏影片容器（可留空）
            document.getElementById('moviesContainer').innerHTML = '';
            document.getElementById('pagination').classList.add('d-none');
            document.title = '加载系列失败 - 系列 - JavDB';
        }
    }

    // ========== 加载系列影片 ==========
    async function loadSeriesMovies(page, scrollToTop = false) {
        currentPage = page;

        const containerLD = document.getElementById('moviesContainerLoading');
        const container = document.getElementById('moviesContainer');
        const paginationEl = document.getElementById('pagination');

        containerLD.innerHTML = `
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2 text-muted">加载中...</p>
            </div>
        `;
        containerLD.classList.remove('d-none');
        paginationEl.classList.add('d-none');

        if (scrollToTop) {
            document.getElementById('moviesContainerLoading').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        const filterVal = document.querySelector('input[name="seriesFilter"]:checked').value;
        // ===== 从排序 radio 获取值 =====
        const sortRadio = document.querySelector('.sort-radio:checked');
        const sortValue = sortRadio ? sortRadio.value : 'release|desc';
        const [sortBy, orderBy] = sortValue.split('|');

        const params = new URLSearchParams({
            series_id: currentSeriesId,
            filter_by: filterVal,
            sort_by: sortBy,
            order_by: orderBy,
            page: page,
            limit: 24
        });

        try {
            const res = await fetch('/api/series-movies?' + params.toString());
            const data = await res.json();
            if (!data.success) throw new Error(data.message || '加载失败');

            const movies = data.data.movies || [];
            renderMovieCards(movies);
            if (movies.length > 0) {
                renderPagination(page, movies.length);
                paginationEl.classList.remove('d-none');
            }

            fadeOut(containerLD);
        } catch (e) {
            container.innerHTML = `
                <div class="col-12 text-center text-danger py-5">
                    加载失败：${e.message}
                    <div><button class="btn btn-primary mt-2" onclick="loadSeriesMovies(${currentPage}, true)">重试</button></div>
                </div>
            `;
            fadeOut(containerLD);
        }
    }

    // ========== 渲染影片卡片 ==========
    function renderMovieCards(movies) {
        const container = document.getElementById('moviesContainer');
        container.innerHTML = '';
        if (movies.length === 0) {
            container.innerHTML = '<div class="col-12 text-center text-muted py-5">暂无影片</div>';
            return;
        }
        movies.forEach(movie => {
            const coverFixed = `/api/image_proxy?url=${encodeURIComponent(movie.cover_url)}`;
            const detailUrl = `/movie/${movie.id}`;
            container.innerHTML += `
                <div class="col-md-3 mb-4">
                    <div class="card movie-card h-100 shadow-sm border-0">
                        <a href="${detailUrl}" class="card-link-block" target="_blank">
                            <div class="position-relative">
                                <img src="${coverFixed}" alt="${movie.number}" onerror="this.src='{{ url_for('static', filename='images/noimage.jpg') }}'">
                                <div class="position-absolute top-0 end-0 d-flex gap-1 m-2">
                                    ${ movie.new_magnets ? '<span class="badge bg-warning text-dark">新种</span>' : (movie.magnets_count > 0 ? '<span class="badge" style="background-color: #32ad76 !important;">含磁链</span>' : '') }
                                    ${ movie.has_cnsub ? '<span class="badge bg-info">中字</span>' : '' }
                                </div>
                            </div>
                            <div class="card-body p-3">
                                <h6 class="card-title text-truncate fw-bold" title="${movie.number}">${movie.number}</h6>
                                <p class="card-text small text-muted mb-2" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; height: 3.0em;" title="${movie.title}">${movie.title}</p>
                                <div class="d-flex justify-content-between mt-2">
                                    <span class="badge bg-light text-dark border">${ movie.release_date ? movie.release_date : '' }</span>
                                    <span class="badge bg-light text-dark border">${ movie.duration ? movie.duration+' 分钟' : '' }</span>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            `;
        });
    }

    // ========== 分页 ==========
    function renderPagination(currentPage, loadedCount) {
        const limit = 24;
        const paginationUl = document.getElementById('paginationList');
        paginationUl.innerHTML = '';

        const isLastPage = loadedCount < limit;
        const prevDisabled = currentPage <= 1 ? 'disabled' : '';

        paginationUl.innerHTML += `
            <li class="page-item ${prevDisabled}">
                <a class="page-link" href="javascript:void(0)" onclick="if(${currentPage} > 1) loadSeriesMovies(${currentPage - 1}, true)">上一页</a>
            </li>
        `;

        let startPage = Math.max(1, currentPage - 2);
        let endPage = isLastPage ? currentPage : currentPage + 2;

        for (let i = startPage; i <= endPage; i++) {
            if (i === currentPage) {
                paginationUl.innerHTML += `<li class="page-item active"><span class="page-link">${i}</span></li>`;
            } else {
                paginationUl.innerHTML += `<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="loadSeriesMovies(${i}, true)">${i}</a></li>`;
            }
        }

        const nextDisabled = isLastPage ? 'disabled' : '';
        paginationUl.innerHTML += `
            <li class="page-item ${nextDisabled}">
                <a class="page-link" href="javascript:void(0)" onclick="if(!${isLastPage}) loadSeriesMovies(${currentPage + 1}, true)">下一页</a>
            </li>
        `;

        paginationUl.innerHTML += `
            <li class="page-item ms-3 d-flex align-items-center">
                <input type="number" id="jumpPageInput" class="form-control text-center px-1" style="width: 60px; height: 38px;" value="${currentPage + 1}" min="1">
                <button class="btn btn-outline-primary ms-1" style="height: 38px;" onclick="jumpToPage()">跳转</button>
            </li>
        `;

        document.getElementById('pagination').classList.remove('d-none');
    }

    function jumpToPage() {
        const val = document.getElementById('jumpPageInput').value;
        const p = parseInt(val, 10);
        if (p && p > 0) loadSeriesMovies(p, true);
    }

    // ==========================================
    // 渐隐隐藏元素函数
    // ==========================================
    function fadeOut(element, duration = 1000) {
        if (!element) return;
        element.style.transition = `opacity ${duration}ms ease`;
        element.style.opacity = '0';
        setTimeout(() => {
            element.classList.add('d-none');
            element.style.opacity = '';
            element.style.transition = '';
        }, duration);
    }

    function updateCollectBtnUI() {
        const btn = document.getElementById('collectBtn');
        if (isSeriesCollected) {
            btn.className = 'btn btn-danger btn-sm rounded-pill shadow-sm';
            btn.innerHTML = '⭐ 已收藏';
        } else {
            btn.className = 'btn btn-outline-danger btn-sm rounded-pill shadow-sm';
            btn.innerHTML = '⭐ 收藏';
        }
    }

    async function toggleCollectSeries() {
        const action = isSeriesCollected ? 'uncollect' : 'collect';
        const btn = document.getElementById('collectBtn');
        btn.disabled = true; // 禁用按钮防止重复点击
        try {
            const res = await fetch(`/api/series/${currentSeriesId}/collect`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action })
            });
            const data = await res.json();
            if (data.success) {
                isSeriesCollected = !isSeriesCollected;
                updateCollectBtnUI(); // 请求成功后更新 UI
            } else {
                alert(data.message || '操作失败');
            }
        } catch (e) {
            alert('网络异常，请重试');
        } finally {
            btn.disabled = false; // 恢复按钮可用状态
        }
    }

    // ========== 监听筛选和排序变化（自动触发防抖） ==========
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.series-filter-radio').forEach(el => {
            el.addEventListener('change', function() {
                const containerLD = document.getElementById('moviesContainerLoading');
                const paginationEl = document.getElementById('pagination');
                containerLD.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary"></div>
                        <p class="mt-2 text-muted">加载中...</p>
                    </div>
                `;
                containerLD.classList.remove('d-none');
                paginationEl.classList.add('d-none');
                debouncedLoadSeriesMovies();
            });
        });

        // ===== 新增：排序 radio 变化监听 =====
        document.querySelectorAll('.sort-radio').forEach(el => {
            el.addEventListener('change', function() {
                const containerLD = document.getElementById('moviesContainerLoading');
                const paginationEl = document.getElementById('pagination');
                containerLD.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary"></div>
                        <p class="mt-2 text-muted">加载中...</p>
                    </div>
                `;
                containerLD.classList.remove('d-none');
                paginationEl.classList.add('d-none');
                debouncedLoadSeriesMovies();
            });
        });

        // 启动
        if (initialSeriesId) {
            loadSeriesInfo(initialSeriesId);
        }
    });
</script>
{% endblock %}
