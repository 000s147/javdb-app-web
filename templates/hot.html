{% extends "base.html" %}

{% block title %}看热播 - JavDB{% endblock %}

{% block styles %}
    <style>
        .movie-card { transition: transform 0.2s; }
        .movie-card:hover { transform: scale(1.02); }
        .movie-card img { width: 100%; height: 220px; object-fit: cover; }
        .filter-section {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 .125rem .25rem rgba(0,0,0,.075);
        }
    </style>
{% endblock %}

{% block content %}
    <h1 class="mb-4 text-center">🔥 热播榜单</h1>

    <!-- 筛选与榜单控制栏 -->
    <div class="filter-section border">
        <!-- 第一行：榜单周期 -->
        <div class="row align-items-center g-2 mb-2 pb-2 border-bottom">
            <div class="col-12 d-flex align-items-center flex-wrap gap-2">
                <span class="fw-bold text-danger me-1 small">🏆 榜单：</span>

                <input type="radio" class="btn-check period-btn" name="periodType" id="p_daily" value="daily" checked>
                <label class="btn btn-outline-danger btn-sm" for="p_daily">日榜</label>

                <input type="radio" class="btn-check period-btn" name="periodType" id="p_weekly" value="weekly">
                <label class="btn btn-outline-danger btn-sm" for="p_weekly">周榜</label>

                <input type="radio" class="btn-check period-btn" name="periodType" id="p_monthly" value="monthly">
                <label class="btn btn-outline-danger btn-sm" for="p_monthly">月榜</label>
            </div>
        </div>

        <!-- 第二行：评价筛选 -->
        <div class="row align-items-center g-2">
            <div class="col-12 d-flex align-items-center flex-wrap gap-2">
                <span class="fw-bold text-muted me-1 small">⚡ 筛选：</span>

                <input type="radio" class="btn-check filter-btn" name="filterBy" id="f_all" value="all">
                <label class="btn btn-outline-primary btn-sm" for="f_all">全部</label>

                <input type="radio" class="btn-check filter-btn" name="filterBy" id="f_high_score" value="high_score" checked>
                <label class="btn btn-outline-primary btn-sm" for="f_high_score">高评价</label>
            </div>
        </div>
    </div>

    <div class="row" id="moviesContainerLoading"></div>

    <!-- 作品列表展示区（无分页） -->
    <div class="row" id="moviesContainer"></div>
{% endblock %}

{% block scripts %}
    <script>
        // 绑定事件：任何单选钮被切换时，立刻重新拉取榜单
        document.querySelectorAll('.period-btn, .filter-btn').forEach(btn => {
            btn.addEventListener('change', () => fetchHotMovies());
        });

        async function fetchHotMovies() {
            const periodVal = document.querySelector('.period-btn:checked').value;
            const filterVal = document.querySelector('.filter-btn:checked').value;

            const containerLD = document.getElementById('moviesContainerLoading');
            const container = document.getElementById('moviesContainer');

            containerLD.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">加载中...</p></div>';
            containerLD.classList.remove('d-none');

            try {
                const res = await fetch(`/api/hot?period=${periodVal}&filter_by=${filterVal}`);
                const data = await res.json();

                if (!data.success) throw new Error(data.error || '获取热播榜单失败');

                const movies = data.data.movies || [];
                renderMovieCards(movies);

            } catch (err) {
                // ---- 错误展示带重试按钮 ----
                container.innerHTML = `
                    <div class="col-12 text-center text-danger py-5">
                        加载失败：${err.message}
                        <div><button class="btn btn-primary mt-2" onclick="fetchHotMovies()">重试</button></div>
                    </div>
                `;
                // 隐藏加载动画（如果有）
                fadeOut(containerLD);
            }
            fadeOut(containerLD);
        }

        // 渲染卡片（复用项目标准卡片结构）
        function renderMovieCards(movies) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';

            if (movies.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-5">当前榜单下暂无数据</div>';
                return;
            }

            movies.forEach(movie => {
                const coverFixed = `/api/image_proxy?url=${encodeURIComponent(movie.cover_url)}`;
                const detailUrl = `/movie/${movie.id}`;

                container.innerHTML += `
                    <div class="col-md-3 mb-4">
                        <div class="card movie-card h-100 shadow-sm border-0">
                            <a href="${detailUrl}" class="card-link-block" target="_blank">
                                <div class="position-relative">
                                    <img src="${coverFixed}" alt="${movie.number}" onerror="this.src='{{ url_for('static', filename='images/noimage.jpg') }}'">
                                    <div class="position-absolute top-0 end-0 d-flex gap-1 m-2">
                                        ${ movie.new_magnets ? '<span class="badge bg-warning text-dark">新种</span>' : (movie.magnets_count > 0 ? '<span class="badge" style="background-color: #32ad76 !important;">含磁链</span>' : '') }
                                        ${ movie.has_cnsub ? '<span class="badge bg-info">中字</span>' : '' }
                                    </div>
                                </div>
                                <div class="card-body p-3">
                                    <h6 class="card-title text-truncate fw-bold" title="${movie.number}">${movie.number}</h6>
                                    <p class="card-text small text-muted mb-2" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; height: 3.0em;" title="${movie.title}">${movie.title}</p>
                                    <div class="d-flex justify-content-between mt-2">
                                        <span class="badge bg-light text-dark border">${ movie.release_date ? movie.release_date : '' }</span>
                                        <span class="badge bg-light text-dark border">${ movie.duration ? movie.duration+' 分钟' : '' }</span>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // ==========================================
        // 渐隐隐藏元素函数
        // ==========================================
        function fadeOut(element, duration = 1000) {
            if (!element) return;

            // 1. 设置过渡动画和目标透明度为 0
            element.style.transition = `opacity ${duration}ms ease`;
            element.style.opacity = '0';

            // 2. 等待动画结束 (300ms) 后，加上 d-none 彻底隐藏，并重置 inline 样式
            setTimeout(() => {
                element.classList.add('d-none');
                element.style.opacity = '';
                element.style.transition = '';
            }, duration);
        }

        // 页面初始化加载默认榜单（日榜 + 全部）
        window.onload = () => fetchHotMovies();
    </script>
{% endblock %}
