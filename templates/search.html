{% extends "base.html" %}

{% block title %}搜索 - JavDB{% endblock %}

{% block styles %}
    <style>
        .movie-card { transition: transform 0.2s; }
        .movie-card:hover { transform: scale(1.02); }
        .movie-card img { width: 100%; height: 220px; object-fit: cover; }
        .actor-card img { height: 240px !important; }
        .filter-section {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 .125rem .25rem rgba(0,0,0,.075);
        }
        /* 排序按钮样式（仿演员页） */
        .custom-radio-label {
            cursor: pointer;
        }
        .btn-check:checked + .custom-radio-label {
            background-color: #dc3545 !important;
            color: #fff !important;
            border-color: #dc3545 !important;
        }

        mark.bg-warning {
            background-color: rgba(255, 193, 7, 0.25) !important; /* 降低背景饱和度，半透明黄 */
            color: #dc3545 !important; /* 让匹配到的关键词呈现暗红色 */
            font-weight: bold;
            padding: 0 2px !important;
            border-radius: 3px;
        }
    </style>
{% endblock %}

{% block content %}
    <h1 class="mb-4 text-center">🔍 搜索</h1>

    <div class="row mb-3 justify-content-center">
        <div class="col-md-6">
            <div class="input-group input-group-lg shadow-sm">
                <input type="text" id="keywordInput" class="form-control" placeholder="输入关键词..." value="{{ initial_keyword }}">
                <button class="btn btn-primary px-4" onclick="doSearch(1)">搜索</button>
            </div>
        </div>
    </div>

    <div class="filter-section border">
        <div class="row align-items-center g-2 mb-2 pb-2 border-bottom">
            <div class="col-12 d-flex align-items-center flex-wrap gap-2">
                <span class="fw-bold text-muted me-1 small">目标：</span>

                <input type="radio" class="btn-check search-type-btn" name="searchType" id="st_movie" value="movie" checked>
                <label class="btn btn-outline-success btn-sm" for="st_movie">🎬 搜影片</label>

                <input type="radio" class="btn-check search-type-btn" name="searchType" id="st_actor" value="actor">
                <label class="btn btn-outline-success btn-sm" for="st_actor">🌟 搜演员</label>

                <input type="radio" class="btn-check search-type-btn" name="searchType" id="st_code" value="code">
                <label class="btn btn-outline-success btn-sm" for="st_code">🏷️ 搜番号</label>

                <input type="radio" class="btn-check search-type-btn" name="searchType" id="st_list" value="list">
                <label class="btn btn-outline-success btn-sm" for="st_list">📋 搜清单</label>

                <!-- 原来的代码中已有：搜影片、搜演员、搜番号、搜清单，现在插入一个“搜系列” -->
                <input type="radio" class="btn-check search-type-btn" name="searchType" id="st_series" value="series">
                <label class="btn btn-outline-success btn-sm" for="st_series">📂 搜系列</label>

                <input type="radio" class="btn-check search-type-btn" name="searchType" id="st_maker" value="maker">
                <label class="btn btn-outline-success btn-sm" for="st_maker">🏢 搜片商</label>

                <!-- 在“搜片商”后面插入 -->
                <input type="radio" class="btn-check search-type-btn" name="searchType" id="st_director" value="director">
                <label class="btn btn-outline-success btn-sm" for="st_director">🎬 搜导演</label>

            </div>
        </div>

        <div id="movieFilters">
            <div class="row align-items-center g-2 mb-2 pb-2 border-bottom">
                <div class="col-12 d-flex align-items-center flex-wrap gap-2">
                    <span class="fw-bold text-muted me-1 small">分类：</span>
                    <input type="radio" class="btn-check type-btn" name="movieType" id="t_all" value="all" checked>
                    <label class="btn btn-outline-primary btn-sm" for="t_all">全部</label>
                    <input type="radio" class="btn-check type-btn" name="movieType" id="t_0" value="0">
                    <label class="btn btn-outline-primary btn-sm" for="t_0">有码</label>
                    <input type="radio" class="btn-check type-btn" name="movieType" id="t_1" value="1">
                    <label class="btn btn-outline-primary btn-sm" for="t_1">无码</label>
                    <input type="radio" class="btn-check type-btn" name="movieType" id="t_2" value="2">
                    <label class="btn btn-outline-primary btn-sm" for="t_2">欧美</label>
                    <input type="radio" class="btn-check type-btn" name="movieType" id="t_3" value="3">
                    <label class="btn btn-outline-primary btn-sm" for="t_3">FC2</label>
                    <input type="radio" class="btn-check type-btn" name="movieType" id="t_4" value="4">
                    <label class="btn btn-outline-primary btn-sm" for="t_4">动漫</label>
                </div>
            </div>

            <!-- 属性筛选行（占满整行） -->
            <div class="row align-items-center g-2">
                <div class="col-12 d-flex align-items-center flex-wrap gap-2">
                    <span class="fw-bold text-muted me-1 small">属性：</span>
                    <input type="radio" class="btn-check filter-btn" name="filterBy" id="f_all" value="all" checked>
                    <label class="btn btn-outline-primary btn-sm" for="f_all">全部</label>
                    <input type="radio" class="btn-check filter-btn" name="filterBy" id="f_can_play" value="can_play">
                    <label class="btn btn-outline-primary btn-sm" for="f_can_play">可播放</label>
                    <input type="radio" class="btn-check filter-btn" name="filterBy" id="f_magnets" value="magnets">
                    <label class="btn btn-outline-primary btn-sm" for="f_magnets">含磁链</label>
                    <input type="radio" class="btn-check filter-btn" name="filterBy" id="f_subtitle" value="subtitle">
                    <label class="btn btn-outline-primary btn-sm" for="f_subtitle">含字幕</label>
                    <input type="radio" class="btn-check filter-btn" name="filterBy" id="f_single" value="single">
                    <label class="btn btn-outline-primary btn-sm" for="f_single">单体作品</label>
                </div>
            </div>

            <!-- 新增排序行（独立一行） -->
            <div class="row mt-2">
                <div class="col-12 d-flex flex-wrap align-items-center gap-2 mt-1">
                    <span class="fw-bold text-muted small">排序：</span>

                    <input type="radio" class="btn-check sort-radio" name="movieSort" id="sort_relevance" value="relevance" checked>
                    <label class="btn custom-radio-label btn-outline-danger btn-sm" for="sort_relevance">相关度</label>

                    <input type="radio" class="btn-check sort-radio" name="movieSort" id="sort_release" value="release">
                    <label class="btn custom-radio-label btn-outline-danger btn-sm" for="sort_release">发布时间</label>

                    <input type="radio" class="btn-check sort-radio" name="movieSort" id="sort_update" value="update">
                    <label class="btn custom-radio-label btn-outline-danger btn-sm" for="sort_update">更新时间</label>

                    <input type="radio" class="btn-check sort-radio" name="movieSort" id="sort_score" value="score">
                    <label class="btn custom-radio-label btn-outline-danger btn-sm" for="sort_score">评分</label>
                </div>
            </div>
        </div>
    </div>

    <div id="searchNotice" class="text-muted mb-3 ms-1 d-none"></div>
    <div class="row" id="moviesContainer"></div>

    <nav aria-label="Page navigation" class="mt-4 d-none" id="pagination">
        <ul class="pagination justify-content-center mb-0" id="paginationList"></ul>
    </nav>
{% endblock %}

{% block scripts %}
    <script>
        let currentKw = '{{ initial_keyword }}';
        let currentPage = 1;

        document.getElementById('keywordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doSearch(1);
        });

        document.querySelectorAll('.search-type-btn').forEach(btn => {
            btn.addEventListener('change', (e) => {
                const searchType = e.target.value;
                document.getElementById('movieFilters').style.display = (searchType === 'movie') ? 'block' : 'none';
                doSearch(1);   // 始终读取当前输入框内容
            });
        });

        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('change', () => doSearch(1));
        });
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('change', () => doSearch(1));
        });
        document.querySelectorAll('.sort-radio').forEach(radio => {
            radio.addEventListener('change', () => doSearch(1));
        });

        function doSearch(page) {
            const kw = document.getElementById('keywordInput').value.trim();
            const container = document.getElementById('moviesContainer');
            const noticeEl = document.getElementById('searchNotice');
            const pageNav = document.getElementById('pagination');

            if (!kw) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-5">请输入关键词</div>';
                pageNav.classList.add('d-none');
                noticeEl.classList.add('d-none');
                currentKw = '';
                updateUrlParams(1);   // 更新 URL，移除 q
                return;
            }

            currentKw = kw;
            executeApi(page);
        }

        async function executeApi(page, scrollToTop = false) {
            currentPage = page;

            const searchType = document.querySelector('.search-type-btn:checked').value;
            const typeVal = document.querySelector('.type-btn:checked').value;
            const filterVal = document.querySelector('.filter-btn:checked').value;
            const sortRadio = document.querySelector('.sort-radio:checked');
            const sortVal = sortRadio ? sortRadio.value : 'relevance';

            const params = new URLSearchParams({
                q: currentKw,
                page: page,
                limit: 24,
                type: searchType,
                movie_type: typeVal,
                movie_filter_by: filterVal,
                movie_sort_by: sortVal
            });

            // 更新 URL（在请求前）
            updateUrlParams(page);

            // ===== 新增：同步导航栏搜索状态 =====
            if (typeof window.updateNavbarSearch === 'function') {
                window.updateNavbarSearch(currentKw, searchType);
            }

            const noticeEl = document.getElementById('searchNotice');
            const container = document.getElementById('moviesContainer');
            const pageNav = document.getElementById('pagination');

            container.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">搜索中...</p></div>';
            noticeEl.classList.add('d-none');
            pageNav.classList.add('d-none');

            try {
                const res = await fetch('/api/search?' + params.toString());
                const data = await res.json();

                if (!data.success) throw new Error(data.error || '后端API请求失败');

                let targetName = '影片';
                if (searchType === 'actor') targetName = '演员';
                else if (searchType === 'code') targetName = '番号';
                else if (searchType === 'list') targetName = '清单';
                else if (searchType === 'series') targetName = '系列';   // 新增
                else if (searchType === 'maker') targetName = '片商';
                else if (searchType === 'director') targetName = '导演';

                noticeEl.innerText = `为您找到 "${currentKw}" 相关${targetName}（第 ${page} 页）`;
                noticeEl.classList.remove('d-none');

                // 根据类型渲染不同卡片
                if (searchType === 'movie') {
                    const movies = data.data.movies || [];
                    renderMovieCards(movies);
                    if (movies.length > 0) { renderPagination(page, movies.length); pageNav.classList.remove('d-none'); }
                } else if (searchType === 'actor') {
                    const actors = data.data.actors || [];
                    renderActorCards(actors);
                    if (actors.length > 0) { renderPagination(page, actors.length); pageNav.classList.remove('d-none'); }
                } else if (searchType === 'code') {
                    const codes = data.data.codes || [];
                    renderCodeCards(codes);
                    if (codes.length > 0) { renderPagination(page, codes.length); pageNav.classList.remove('d-none'); }
                } else if (searchType === 'list') {   // ✅ 新增清单分支
                    const lists = data.data.lists || [];
                    renderListCards(lists);
                    if (lists.length > 0) { renderPagination(page, lists.length); pageNav.classList.remove('d-none'); }
                } else if (searchType === 'series') {
                    const series = data.data.series || [];
                    renderSeriesCards(series);
                    if (series.length > 0) { renderPagination(page, series.length); pageNav.classList.remove('d-none'); }
                } else if (searchType === 'maker') {
                    const makers = data.data.makers || [];
                    renderMakerCards(makers);
                    if (makers.length > 0) { renderPagination(page, makers.length); pageNav.classList.remove('d-none'); }
                } else if (searchType === 'director') {
                    const directors = data.data.directors || [];
                    renderDirectorCards(directors);
                    if (directors.length > 0) { renderPagination(page, directors.length); pageNav.classList.remove('d-none'); }
                }

                if (scrollToTop) {
                    document.getElementById('moviesContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
                }

                document.title = currentKw + ' - 搜' + targetName + ' - JavDB';
            } catch (err) {
                container.innerHTML = `
                    <div class="col-12 text-center text-danger py-5">
                        搜索失败：${err.message}
                        <div><button class="btn btn-primary mt-2" onclick="executeApi(${page}, true)">重试</button></div>
                    </div>
                `;
                pageNav.classList.add('d-none'); // 确保分页隐藏
            }
        }

        // ====================== 番号渲染 (新增) ======================
        function renderCodeCards(codes) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';
            if (codes.length === 0) { container.innerHTML = '<div class="col-12 text-center text-muted py-5">未检索到符合条件的番号</div>'; return; }

            codes.forEach(code => {
                const detailUrl = `/code/${code.id}`;
                // 【新增】处理高亮文本
                const highlightedName = highlightKeyword(code.name, currentKw);
                container.innerHTML += `
                    <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
                        <div class="card h-100 movie-card shadow-sm border-0" style="background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);">
                            <a href="${detailUrl}" class="card-link-block h-100 d-flex flex-column justify-content-center align-items-center py-4 text-decoration-none" target="_blank">
                                <div class="card-body text-center">
                                    <h3 class="card-title fw-bold text-primary mb-2">${highlightedName}</h3>
                                    <span class="badge bg-white text-dark border shadow-sm">${code.videos_count} 部影片</span>
                                </div>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // ====================== 清单渲染 (新增) ======================
        function renderListCards(lists) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';
            if (lists.length === 0) { container.innerHTML = '<div class="col-12 text-center text-muted py-5">未检索到符合条件的清单</div>'; return; }

            lists.forEach(list => {
                const detailUrl = `/list/${list.id}`;
                // 【新增】处理高亮文本
                const highlightedName = highlightKeyword(list.name, currentKw);
                container.innerHTML += `
                    <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
                        <div class="card h-100 movie-card shadow-sm border-0" style="background: linear-gradient(135deg, #fff9e6 0%, #fce4ec 100%);">
                            <a href="${detailUrl}" class="card-link-block h-100 d-flex flex-column justify-content-center align-items-center py-4 text-decoration-none" target="_blank">
                                <div class="card-body text-center">
                                    <h5 class="card-title fw-bold text-dark mb-2">${highlightedName}</h5>
                                    <p class="text-muted small">📁 ${list.movies_count || 0} 部影片</p>
                                    ${list.is_default ? '<span class="badge bg-secondary">默认</span>' : ''}
                                    <span class="badge bg-light text-dark border">${list.privacy === 'open' ? '公开' : '私密'}</span>
                                </div>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // ====================== 系列渲染 (新增) ======================
        function renderSeriesCards(seriesList) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';
            if (seriesList.length === 0) { container.innerHTML = '<div class="col-12 text-center text-muted py-5">未检索到符合条件的系列</div>'; return; }

            seriesList.forEach(ser => {
                const detailUrl = `/series/${ser.id}`;
                const typeMap = {0:'有码',1:'无码',2:'欧美',3:'FC2',4:'动漫'};
                const typeLabel = typeMap[ser.type] || '未知';
                // 【新增】处理高亮文本
                const highlightedName = highlightKeyword(ser.name, currentKw);
                container.innerHTML += `
                    <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
                        <div class="card h-100 movie-card shadow-sm border-0" style="background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);">
                            <a href="${detailUrl}" class="card-link-block h-100 d-flex flex-column justify-content-center align-items-center py-4 text-decoration-none" target="_blank">
                                <div class="card-body text-center">
                                    <h5 class="card-title fw-bold text-dark mb-2">${highlightedName}</h5>
                                    <p class="text-muted small">📁 ${ser.videos_count || 0} 部影片</p>
                                    <span class="badge bg-light text-dark border">${typeLabel}</span>
                                </div>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // ====================== 片商渲染 (新增) ======================
        function renderMakerCards(makers) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';
            if (makers.length === 0) { container.innerHTML = '<div class="col-12 text-center text-muted py-5">未检索到符合条件的片商</div>'; return; }

            makers.forEach(maker => {
                const detailUrl = `/maker/${maker.id}`;
                const typeMap = {0:'有码',1:'无码',2:'欧美',3:'FC2',4:'动漫'};
                const typeLabel = typeMap[maker.type] || '未知';
                // 【新增】处理高亮文本
                const highlightedName = highlightKeyword(maker.name, currentKw);
                container.innerHTML += `
                    <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
                        <div class="card h-100 movie-card shadow-sm border-0" style="background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);">
                            <a href="${detailUrl}" class="card-link-block h-100 d-flex flex-column justify-content-center align-items-center py-4 text-decoration-none" target="_blank">
                                <div class="card-body text-center">
                                    <h5 class="card-title fw-bold text-dark mb-2">${highlightedName}</h5>
                                    <p class="text-muted small">📁 ${maker.videos_count || 0} 部影片</p>
                                    <span class="badge bg-light text-dark border">${typeLabel}</span>
                                </div>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // ====================== 导演渲染 (新增) ======================
        function renderDirectorCards(directors) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';
            if (directors.length === 0) { container.innerHTML = '<div class="col-12 text-center text-muted py-5">未检索到符合条件的导演</div>'; return; }

            directors.forEach(director => {
                const detailUrl = `/director/${director.id}`;
                const typeMap = {0:'有码',1:'无码',2:'欧美',3:'FC2',4:'动漫'};
                const typeLabel = typeMap[director.type] || '未知';
                // 【新增】处理高亮文本
                const highlightedName = highlightKeyword(director.name, currentKw);
                container.innerHTML += `
                    <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
                        <div class="card h-100 movie-card shadow-sm border-0" style="background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);">
                            <a href="${detailUrl}" class="card-link-block h-100 d-flex flex-column justify-content-center align-items-center py-4 text-decoration-none" target="_blank">
                                <div class="card-body text-center">
                                    <h5 class="card-title fw-bold text-dark mb-2">${highlightedName}</h5>
                                    <p class="text-muted small">🎥 ${director.videos_count || 0} 部影片</p>
                                    <span class="badge bg-light text-dark border">${typeLabel}</span>
                                </div>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // ====================== 影片渲染 ======================
        function renderMovieCards(movies) { /* 保持原有代码不变 */
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';
            if (movies.length === 0) { container.innerHTML = '<div class="col-12 text-center text-muted py-5">未检索到符合条件的影片</div>'; return; }
            movies.forEach(movie => {
                const coverFixed = `/api/image_proxy?url=${encodeURIComponent(movie.cover_url)}`;
                const detailUrl = `/movie/${movie.id}`;

                // 【新增】处理高亮文本
                const highlightedNumber = highlightKeyword(movie.number, currentKw);
                const highlightedTitle = highlightKeyword(movie.title, currentKw);

                container.innerHTML += `
                    <div class="col-md-3 mb-4">
                        <div class="card movie-card h-100 shadow-sm border-0">
                            <a href="${detailUrl}" class="card-link-block" target="_blank">
                                <div class="position-relative">
                                    <img src="${coverFixed}" alt="${movie.number}" onerror="this.src='{{ url_for('static', filename='images/noimage.jpg') }}'">
                                    <div class="position-absolute top-0 end-0 d-flex gap-1 m-2">
                                        ${ movie.new_magnets ? '<span class="badge bg-warning text-dark">新种</span>' : (movie.magnets_count > 0 ? '<span class="badge" style="background-color: #32ad76 !important;">含磁链</span>' : '') }
                                        ${ movie.has_cnsub ? '<span class="badge bg-info">中字</span>' : '' }
                                    </div>
                                </div>
                                <div class="card-body p-3">
                                    <h6 class="card-title text-truncate fw-bold" title="${movie.number}">${highlightedNumber}</h6>
                                    <p class="card-text small text-muted mb-2" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; height: 3.0em;" title="${movie.title}">${highlightedTitle}</p>
                                    <div class="d-flex justify-content-between mt-2">
                                        <span class="badge bg-light text-dark border">${ movie.release_date ? movie.release_date : '' }</span>
                                        <span class="badge bg-light text-dark border">${ movie.duration ? movie.duration+' 分钟' : '' }</span>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // ====================== 演员渲染 ======================
        function renderActorCards(actors) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';
            if (actors.length === 0) { container.innerHTML = '<div class="col-12 text-center text-muted py-5">未检索到符合条件的演员</div>'; return; }
            actors.forEach(actor => {
                const avatarFixed = `/api/image_proxy?url=${encodeURIComponent(actor.avatar_url)}`;
                const detailUrl = `/actor/${actor.id}`;

                // 【新增】处理高亮文本
                const highlightedName = highlightKeyword(actor.name, currentKw);
                const highlightedOtherName = actor.other_name ? highlightKeyword(actor.other_name, currentKw) : '';
                const otherNameHtml = actor.other_name ? `<div class="text-muted small text-truncate" title="${actor.other_name}">${highlightedOtherName}</div>` : '';

                container.innerHTML += `
                    <div class="col-lg-2 col-md-3 col-sm-4 col-6 mb-4">
                        <div class="card h-100 movie-card actor-card shadow-sm border-0">
                            <a href="${detailUrl}" class="card-link-block" target="_blank">
                                <img src="${avatarFixed}" class="card-img-top" alt="${actor.name}" data-type="avatar" onerror="this.src='{{ url_for('static', filename='images/noavatar.jpg') }}'">
                                <div class="card-body p-2 text-center">
                                    <h5 class="card-title h6 text-truncate mb-1" title="${actor.name}">${highlightedName}</h5>
                                    ${otherNameHtml}
                                    <span class="badge bg-light text-dark border mt-1">${actor.videos_count} 部影片</span>
                                </div>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // ====================== 动态分页条 ======================
        function renderPagination(currentPage, loadedCount) {
            const limit = 24;
            const paginationUl = document.getElementById('paginationList');
            paginationUl.innerHTML = '';

            const isLastPage = loadedCount < limit;
            const prevDisabled = currentPage <= 1 ? 'disabled' : '';

            paginationUl.innerHTML += `<li class="page-item ${prevDisabled}"><a class="page-link" href="javascript:void(0)" onclick="if(${currentPage} > 1) executeApi(${currentPage - 1}, true)">上一页</a></li>`;
            let startPage = Math.max(1, currentPage - 2);
            let endPage = isLastPage ? currentPage : currentPage + 2;

            for (let i = startPage; i <= endPage; i++) {
                if (i === currentPage) {
                    paginationUl.innerHTML += `<li class="page-item active"><span class="page-link">${i}</span></li>`;
                } else {
                    paginationUl.innerHTML += `<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="executeApi(${i}, true)">${i}</a></li>`;
                }
            }
            const nextDisabled = isLastPage ? 'disabled' : '';
            paginationUl.innerHTML += `<li class="page-item ${nextDisabled}"><a class="page-link" href="javascript:void(0)" onclick="if(!${isLastPage}) executeApi(${currentPage + 1}, true)">下一页</a></li>`;
            paginationUl.innerHTML += `
                <li class="page-item ms-3 d-flex align-items-center">
                    <input type="number" id="jumpPageInput" class="form-control text-center px-1" style="width: 60px; height: 38px;" value="${currentPage + 1}" min="1">
                    <button class="btn btn-outline-primary ms-1" style="height: 38px;" onclick="jumpToPage()">跳转</button>
                </li>
            `;
        }

        function jumpToPage() {
            const val = document.getElementById('jumpPageInput').value;
            const p = parseInt(val, 10);
            if (p && p > 0) executeApi(p, true);
        }

        function updateUrlParams(page) {
            const kw = document.getElementById('keywordInput').value.trim();
            const searchType = document.querySelector('.search-type-btn:checked').value;
            const movieType = document.querySelector('.type-btn:checked').value;
            const filterBy = document.querySelector('.filter-btn:checked').value;
            const sort = document.querySelector('.sort-radio:checked').value;

            const params = new URLSearchParams();
            if (kw) params.set('q', kw);
            // 只有非作品搜索才写入 type（作品是默认，省略）
            if (searchType !== 'movie') params.set('type', searchType);
            // 仅当搜索类型为作品时，写入作品专用参数
            if (searchType === 'movie') {
                if (movieType !== 'all') params.set('movie_type', movieType);
                if (filterBy !== 'all') params.set('filter_by', filterBy);
                if (sort !== 'relevance') params.set('sort', sort);
            }
            if (page && page > 1) params.set('page', page);

            const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
            history.replaceState({}, '', newUrl);
        }

        // === 修改后的关键词高亮核心函数 ===
        function highlightKeyword(text, keyword) {
            // 加上 !keyword.trim() 判断，确保如果关键词全是空格，则直接返回原文本不进行高亮
            if (!text || !keyword || !keyword.trim()) return text || '';

            // 转义正则特殊字符，防止关键词中带有特殊符号时引发报错
            const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            // 'gi' 表示全局匹配且忽略大小写
            const regex = new RegExp(`(${escapedKeyword})`, 'gi');
            // 使用 Bootstrap 的 mark 样式包裹匹配文本
            return String(text).replace(regex, '<mark class="p-0 bg-warning text-dark">$1</mark>');
        }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);

            // 1. 关键词
            const q = params.get('q') || '';
            currentKw = q;   // 🌟 关键：同步全局变量
            document.getElementById('keywordInput').value = q;

            // 2. 搜索类型
            const type = params.get('type') || 'movie';
            const typeRadio = document.querySelector(`.search-type-btn[value="${type}"]`);
            if (typeRadio) typeRadio.checked = true;
            // 控制电影筛选区的显示/隐藏
            document.getElementById('movieFilters').style.display = (type === 'movie') ? 'block' : 'none';

            // 3. 影片类型（仅当 type === 'movie' 时有效）
            const movieType = params.get('movie_type') || 'all';
            const movieTypeRadio = document.querySelector(`.type-btn[value="${movieType}"]`);
            if (movieTypeRadio) movieTypeRadio.checked = true;

            // 4. 属性筛选
            const filterBy = params.get('filter_by') || 'all';
            const filterRadio = document.querySelector(`.filter-btn[value="${filterBy}"]`);
            if (filterRadio) filterRadio.checked = true;

            // 5. 排序
            const sort = params.get('sort') || 'relevance';
            const sortRadio = document.querySelector(`.sort-radio[value="${sort}"]`);
            if (sortRadio) sortRadio.checked = true;

            // 6. 页码
            const page = parseInt(params.get('page')) || 1;

            // 如果关键词非空，执行搜索；否则显示提示
            if (q) {
                executeApi(page);
            } else {
                const container = document.getElementById('moviesContainer');
                container.innerHTML = '<div class="col-12 text-center text-muted py-5">请输入关键词进行搜索</div>';
                document.getElementById('pagination').classList.add('d-none');
                // 不显示类型提示（保持隐藏）
                document.getElementById('searchNotice').classList.add('d-none');
            }
        };
    </script>
{% endblock %}
