{% extends "base.html" %}

{% block title %}加载中...{% endblock %}

{% block styles %}
    <style>
        .article-detail img { max-width: 100%; height: auto; }
        .article-content { font-size: 1.05rem; line-height: 1.8; color: #374151; }
        .article-content p { margin-bottom: 1rem; }
        
        /* ===== 引用块美化：品牌紫蓝边框 ===== */
        .article-content .quote { 
            background: #f8f9fa; 
            border-left: 4px solid #667eea; /* 原为原生蓝 #0d6efd */
            padding: 1rem 1.2rem; 
            margin: 1.5rem 0; 
            border-radius: 0 8px 8px 0;
            color: #4b5563;
            font-style: italic;
        }

        /* ===== 转载信息链接 ===== */
        #originInfo a, #articleContent a { 
            color: #4f46e5; 
            text-decoration: none; 
            transition: color 0.2s; 
        }
        #originInfo a:hover, #articleContent a:hover { 
            color: #764ba2; 
            text-decoration: underline; 
        }

        /* ===== 作者/分类胶囊标签 ===== */
        .badge-brand {
            background: #f5f6ff !important;
            color: #4f46e5 !important;
            border: 1px solid #c7d2fe !important;
            padding: 0.4em 0.8em;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.85rem;
        }

        /* 覆盖原生的蓝色 Spinner */
        .text-primary { color: #667eea !important; }

        /* ============================================================ */
        /* ===== 相关影片卡片（与 actor_home.html 完全一致） ===== */
        /* ============================================================ */
        .movie-card {
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: transform .25s ease, box-shadow .25s ease;
        }
        .movie-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-3);
        }
        .movie-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform .4s ease;
        }
        .movie-card:hover img {
            transform: scale(1.04);
        }

        /* 相关影片标题（品牌渐变） */
        #relatedMoviesTitle {
            display: inline-block;
            font-weight: 800;
            letter-spacing: .5px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
{% endblock %}

{% block content %}
    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2 text-muted">加载中...</p>
    </div>

    <div id="error" class="alert alert-danger d-none" role="alert"></div>

    <div id="detailContainer" class="d-none">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 id="articleTitle" class="fw-bold mb-3"></h1>
                <div class="d-flex flex-wrap gap-3 text-muted mb-4">
                    <span id="articleAuthor" class="badge badge-brand"></span>
                    <span id="articleCategory" class="badge badge-brand"></span>
                    <span id="articleDate" class="small"></span>
                </div>
                <!-- 转载信息 -->
                <div id="originInfo" class="mb-3 small text-muted"></div>
                <div id="articleContent" class="article-content"></div>

                <!-- 🆕 相关影片 -->
                <div id="relatedMoviesContainer" class="mt-4 d-none">
                    <h4 id="relatedMoviesTitle" class="mb-3">🎬 相关影片</h4>
                    <div class="row" id="relatedMoviesList"></div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
<script>
    const articleId = '{{ article_id }}';

    async function loadArticleDetail() {
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const container = document.getElementById('detailContainer');

        try {
            const res = await fetch(`/api/article/${articleId}`);
            const data = await res.json();
            if (!data.success) throw new Error(data.message || '获取详情失败');

            const article = data.data;
            document.title = article.title + ' - JavDB';

            document.getElementById('articleTitle').textContent = article.title;

            // ----- 转载信息 -----
            const originDiv = document.getElementById('originInfo');
            if (article.origin_name && article.origin_url) {
                originDiv.innerHTML = `转载自：<a href="${article.origin_url}" target="_blank" rel="nofollow">${article.origin_name}</a>`;
            } else {
                originDiv.innerHTML = '';
            }

            // 作者和类别设置为链接
            const authorHtml = article.author ? `<a href="/articles?author_id=${article.author.id}&author_name=${article.author.name}" class="text-decoration-none" style="color: inherit;">${article.author.name}</a>` : '未知作者';
            const categoryHtml = article.category ? `<a href="/articles?category_id=${article.category.id}&category_name=${article.category.name}" class="text-decoration-none" style="color: inherit;">${article.category.name}</a>` : '未分类';
            document.getElementById('articleAuthor').innerHTML = authorHtml;
            document.getElementById('articleCategory').innerHTML = categoryHtml;

            const d = new Date(article.released_at);
            const released = d.toLocaleString('sv-SE', {
              timeZone: 'Asia/Shanghai',
            }).slice(0, 16).replace('T', ' ');
            document.getElementById('articleDate').textContent = '发布于 ' + released;

            // 渲染内容
            const contentDiv = document.getElementById('articleContent');
            contentDiv.innerHTML = article.content || '暂无内容';

            // 处理图片
            const images = contentDiv.querySelectorAll('img');
            images.forEach(img => {
                const src = img.getAttribute('src');
                if (src) {
                    img.src = `/api/image?url=${encodeURIComponent(src)}`;
                }
            });

            // ===== 🆕 渲染相关影片 =====
            const related = article.related_movies || [];
            const relatedContainer = document.getElementById('relatedMoviesContainer');
            const relatedList = document.getElementById('relatedMoviesList');

            if (related.length > 0) {
                let html = '';
                related.forEach(movie => {
                    const tb = movie.thumb_url || '';
                    const newtb = tb.replace("small_covers/", "covers/");

                    // 注意：related_movies 的封面字段是 thumb_url
                    const coverFixed = `/api/image?url=${encodeURIComponent(newtb)}`;
                    const detailUrl  = `/movie/${movie.id}`;
                    html += `
                        <div class="col-6 col-md-3 mb-4">
                            <div class="card movie-card h-100 shadow-sm border-0">
                                <a href="${detailUrl}" class="card-link-block" target="_blank">
                                    <div class="position-relative">
                                        <img src="${coverFixed}" alt="${movie.number || ''}"
                                             onerror="this.src='{{ url_for('static', filename='images/noimage.jpg') }}'">
                                        ${ movie.score
                                            ? `<div class="position-absolute top-0 end-0 m-2">
                                                   <span class="badge bg-warning text-dark">⭐ ${movie.score}</span>
                                               </div>`
                                            : '' }
                                    </div>
                                    <div class="card-body p-3">
                                        <h6 class="card-title text-truncate fw-bold" title="${movie.number || ''}">
                                            ${movie.number || ''}
                                        </h6>
                                        <p class="card-text small text-muted mb-2"
                                           style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; height: 3.0em;"
                                           title="${movie.title || ''}">
                                            ${movie.title || ''}
                                        </p>
                                        <div class="d-flex justify-content-between mt-2">
                                            <span class="badge bg-light text-dark border">
                                                ${movie.release_date || ''}
                                            </span>
                                        </div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    `;
                });
                relatedList.innerHTML = html;
                relatedContainer.classList.remove('d-none');
            }

            loading.classList.add('d-none');
            container.classList.remove('d-none');

        } catch (e) {
            loading.classList.add('d-none');
            error.classList.remove('d-none');
            error.textContent = '加载失败：' + e.message;
        }
    }

    document.addEventListener('DOMContentLoaded', loadArticleDetail);
</script>
{% endblock %}
