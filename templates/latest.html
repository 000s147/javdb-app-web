{% extends "base.html" %}

{% block title %}最新上架 - JavDB{% endblock %}

{% block styles %}
    <style>
        .movie-card {
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: transform .25s ease, box-shadow .25s ease;
        }
        .movie-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-3);
        }
        .movie-card img { width: 100%; height: 220px; object-fit: cover; transition: transform .4s ease; }
        .movie-card:hover img { transform: scale(1.04); }
        .filter-section {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 .125rem .25rem rgba(0,0,0,.075);
        }
        .filter-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .filter-label {
            font-weight: 600;
            margin-right: 5px;
            font-size: 0.9rem;
            min-width: 50px;
        }

        /* ===== 分页容器 ===== */
        #pagination {
            margin-top: 2rem !important;
        }

        #paginationList {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            align-items: center;
        }

        #paginationList .page-item {
            margin: 0;
        }

        #paginationList .page-item .page-link {
            min-width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            margin-left: 0 !important;
            border: 1px solid #e9ecef;
            border-radius: 10px !important;
            background: #fff;
            color: #495057;
            font-weight: 500;
            font-size: 0.9rem;
            line-height: 1;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
            text-decoration: none;
        }

        #paginationList .page-item .page-link:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
            color: #4f46e5;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.12);
        }

        #paginationList .page-item.active .page-link {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
        }

        #paginationList .page-item.disabled .page-link {
            background: #f8f9fa;
            border-color: #f1f3f5;
            color: #adb5bd;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        #paginationList .page-item.disabled .page-link:hover {
            background: #f8f9fa;
            border-color: #f1f3f5;
            color: #adb5bd;
            transform: none;
            box-shadow: none;
        }

        /* ===== 跳页区 ===== */
        #paginationList .jump-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 10px;
        }

        #jumpPageInput {
            width: 64px;
            height: 40px;
            border-radius: 10px !important;
            border: 1px solid #e9ecef !important;
            text-align: center;
            font-weight: 500;
            color: #495057;
            transition: all 0.2s;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        #jumpPageInput::-webkit-outer-spin-button,
        #jumpPageInput::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #jumpPageInput:focus {
            border-color: #a5b4fc !important;
            box-shadow: 0 0 0 3px rgba(165, 180, 252, 0.25);
            outline: none;
        }

        #paginationList .jump-btn {
            height: 40px;
            padding: 0 16px;
            border-radius: 10px !important;
            border: 1px solid #c7d2fe;
            background: #fff;
            color: #4f46e5;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        #paginationList .jump-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
            transform: translateY(-1px);
        }

        /* ===== 小屏适配 ===== */
        @media (max-width: 576px) {
            #paginationList { gap: 4px; }
            #paginationList .page-item .page-link {
                min-width: 34px;
                height: 34px;
                padding: 0 8px;
                font-size: 0.82rem;
            }
            #jumpPageInput,
            #paginationList .jump-btn {
                height: 34px;
            }
            #jumpPageInput { width: 54px; }
        }

                /* ===== 筛选按钮：未选中 ===== */
        .custom-radio-label {
            border: 1px solid #e5e7eb !important;
            border-radius: 0.375rem !important;
            padding: 0.375rem 0.75rem;
            background-color: #ffffff !important;
            color: #4b5563 !important;
            font-weight: 500;
            margin-bottom: 4px;
            transition: background-color 0.22s ease, color 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, transform 0.22s ease;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }
        /* ===== 未选中悬停 ===== */
        .btn-check:not(:checked) + .custom-radio-label:hover {
            background-color: #f5f6ff !important;
            border-color: #c7d2fe !important;
            color: #4f46e5 !important;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.12);
        }
        /* ===== 选中 ===== */
        .btn-check:checked + .custom-radio-label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: #fff !important;
            border-color: transparent !important;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
        }
        /* ===== 选中悬停 ===== */
        .btn-check:checked + .custom-radio-label:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
        }
        /* ===== 按下 ===== */
        .custom-radio-label:active {
            transform: scale(0.97);
        }

        /* 👇 彻底去除点击/聚焦时的原生蓝色外发光 */
        .btn-check:focus + .custom-radio-label,
        .btn-check:active + .custom-radio-label {
            outline: none !important;
            box-shadow: none !important;
        }
        .btn-check:checked:focus + .custom-radio-label {
            outline: none !important;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35) !important;
        }

        /* 全局覆盖原本的蓝色 Spinner */
        .text-primary { color: #667eea !important; }
    </style>
{% endblock %}

{% block content %}
    <h1 class="mb-4 text-center">♻️ 最新上架</h1>

    <div class="filter-section border">
        <div class="filter-row mb-3 pb-3 border-bottom">
            <span class="filter-label text-muted">⭐ 类别：</span>
            <input type="radio" class="btn-check filter-opt" name="f_type" id="t_all" value="all" checked>
            <label class="btn custom-radio-label btn-sm" for="t_all">全部</label>

            <input type="radio" class="btn-check filter-opt" name="f_type" id="t_0" value="0">
            <label class="btn custom-radio-label btn-sm" for="t_0">有码</label>

            <input type="radio" class="btn-check filter-opt" name="f_type" id="t_1" value="1">
            <label class="btn custom-radio-label btn-sm" for="t_1">无码</label>

            <input type="radio" class="btn-check filter-opt" name="f_type" id="t_2" value="2">
            <label class="btn custom-radio-label btn-sm" for="t_2">欧美</label>

            <input type="radio" class="btn-check filter-opt" name="f_type" id="t_3" value="3">
            <label class="btn custom-radio-label btn-sm" for="t_3">FC2</label>

            <input type="radio" class="btn-check filter-opt" name="f_type" id="t_4" value="4">
            <label class="btn custom-radio-label btn-sm" for="t_4">动漫</label>
        </div>

        <div class="filter-row mb-3 pb-3 border-bottom">
            <span class="filter-label text-muted">⚡ 筛选：</span>
            <input type="radio" class="btn-check filter-opt" name="f_filter" id="f_all" value="all" checked>
            <label class="btn custom-radio-label btn-sm" for="f_all">全部</label>

            <input type="radio" class="btn-check filter-opt" name="f_filter" id="f_can_play" value="can_play">
            <label class="btn custom-radio-label btn-sm" for="f_can_play">可播放</label>

            <input type="radio" class="btn-check filter-opt" name="f_filter" id="f_magnets" value="magnets">
            <label class="btn custom-radio-label btn-sm" for="f_magnets">含磁链</label>

            <input type="radio" class="btn-check filter-opt" name="f_filter" id="f_subtitle" value="subtitle">
            <label class="btn custom-radio-label btn-sm" for="f_subtitle">含字幕</label>
        </div>

        <div class="filter-row">
            <span class="filter-label text-muted">🔃 排序：</span>
            <input type="radio" class="btn-check filter-opt" name="f_sort" id="s_update" value="update">
            <label class="btn custom-radio-label btn-sm" for="s_update">更新时间</label>

            <input type="radio" class="btn-check filter-opt" name="f_sort" id="s_release" value="release" checked>
            <label class="btn custom-radio-label btn-sm" for="s_release">发布时间</label>
        </div>
    </div>

    <div class="row" id="moviesContainerLoading"></div>

    <div class="row" id="moviesContainer"></div>

    <nav aria-label="Page navigation" class="mt-4 d-none" id="pagination">
        <ul class="pagination justify-content-center mb-0" id="paginationList"></ul>
    </nav>
{% endblock %}

{% block scripts %}
    <script>
        let currentPage = 1;

        // 监听所有筛选项的变化
        document.querySelectorAll('.filter-opt').forEach(btn => {
            btn.addEventListener('change', () => fetchLatestMovies(1));
        });

        async function fetchLatestMovies(page, scrollToTop = false) {
            currentPage = page;

            const reqType = document.querySelector('input[name="f_type"]:checked').value;
            const filterBy = document.querySelector('input[name="f_filter"]:checked').value;
            const sortBy = document.querySelector('input[name="f_sort"]:checked').value;

            const containerLD = document.getElementById('moviesContainerLoading');
            const container = document.getElementById('moviesContainer');
            const paginationEl = document.getElementById('pagination');

            containerLD.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">加载中...</p></div>';
            containerLD.classList.remove('d-none');
            paginationEl.classList.add('d-none');

            if (scrollToTop) {
                document.getElementById('moviesContainerLoading').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            try {
                const res = await fetch(`/api/latest?type=${reqType}&filter_by=${filterBy}&sort_by=${sortBy}&page=${page}&limit=24`);
                const data = await res.json();

                if (!data.success) throw new Error(data.error || '获取数据失败');

                const movies = data.data.movies || [];
                renderMovieCards(movies);

                // 无条件渲染：空数据时也会显示分页（当前页 + 上一页可点 + 跳页可用）
                renderPagination(page, movies.length);
                fadeOut(containerLD);

            } catch (err) {
                // ---- 错误展示带重试按钮 ----
                container.innerHTML = `
                    <div class="col-12 text-center text-danger py-5">
                        加载失败：${err.message}
                        <div><button class="btn btn-primary mt-2" onclick="fetchLatestMovies(${page})">重试</button></div>
                    </div>
                `;
                fadeOut(containerLD);
                // 隐藏分页
                paginationEl.classList.add('d-none');
            }
        }

        // 渲染作品卡片
        function renderMovieCards(movies) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';

            if (movies.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-5">当前条件下暂无数据</div>';
                return;
            }

            movies.forEach(movie => {
                const coverFixed = `/api/image?url=${encodeURIComponent(movie.cover_url || movie.thumb_url)}`;
                const detailUrl = `/movie/${movie.id}`;

                container.innerHTML += `
                    <div class="col-md-3 mb-4">
                        <div class="card movie-card h-100 shadow-sm border-0">
                            <a href="${detailUrl}" class="card-link-block" target="_blank">
                                <div class="position-relative">
                                    <img src="${coverFixed}" alt="${movie.number}" onerror="this.src='{{ url_for('static', filename='images/noimage.jpg') }}'">
                                    <div class="position-absolute top-0 end-0 d-flex gap-1 m-2">
                                        ${ movie.new_magnets ? '<span class="badge bg-warning text-dark">新种</span>' : (movie.magnets_count > 0 ? '<span class="badge" style="background-color: #32ad76 !important;">含磁链</span>' : '') }
                                        ${ movie.has_cnsub ? '<span class="badge bg-info">中字</span>' : '' }
                                    </div>
                                </div>
                                <div class="card-body p-3">
                                    <h6 class="card-title text-truncate fw-bold" title="${movie.number}">${movie.number}</h6>
                                    <p class="card-text small text-muted mb-2" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; height: 3.0em;" title="${movie.title}">${movie.title}</p>
                                    <div class="d-flex justify-content-between mt-2">
                                        <span class="badge bg-light text-dark border">${ movie.release_date ? movie.release_date : '' }</span>
                                        <span class="badge bg-light text-dark border">${ movie.duration ? movie.duration+' 分钟' : '' }</span>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // 渲染分页 (与标签搜索页面的逻辑一致)
        function renderPagination(currentPage, loadedCount) {
            const limit = 24;
            const paginationUl = document.getElementById('paginationList');
            paginationUl.innerHTML = '';

            // 当前页返回不足 24 条，视为最后一页
            const isLastPage = loadedCount < limit;

            // 首页
            paginationUl.innerHTML += `
                <li class="page-item ${currentPage <= 1 ? 'disabled' : ''}">
                    <a class="page-link" href="javascript:void(0)"
                    onclick="if(${currentPage} > 1) fetchLatestMovies(1, true)" title="首页">«</a>
                </li>
            `;

            // 上一页
            paginationUl.innerHTML += `
                <li class="page-item ${currentPage <= 1 ? 'disabled' : ''}">
                    <a class="page-link" href="javascript:void(0)"
                    onclick="if(${currentPage} > 1) fetchLatestMovies(${currentPage - 1}, true)" title="上一页">‹</a>
                </li>
            `;

            // 页码窗口
            const startPage = Math.max(1, currentPage - 2);
            const endPage = isLastPage ? currentPage : currentPage + 2;

            // 左省略号
            if (startPage > 1) {
                paginationUl.innerHTML += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                if (i === currentPage) {
                    paginationUl.innerHTML += `<li class="page-item active"><span class="page-link">${i}</span></li>`;
                } else {
                    paginationUl.innerHTML += `
                        <li class="page-item">
                            <a class="page-link" href="javascript:void(0)" onclick="fetchLatestMovies(${i}, true)">${i}</a>
                        </li>
                    `;
                }
            }

            // 右省略号：仅当不是最后一页
            if (!isLastPage) {
                paginationUl.innerHTML += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
            }

            // 下一页
            paginationUl.innerHTML += `
                <li class="page-item ${isLastPage ? 'disabled' : ''}">
                    <a class="page-link" href="javascript:void(0)"
                    onclick="if(!${isLastPage}) fetchLatestMovies(${currentPage + 1}, true)" title="下一页">›</a>
                </li>
            `;

            // 跳页
            paginationUl.innerHTML += `
                <li class="jump-wrap">
                    <input type="number" id="jumpPageInput" value="${currentPage + 1}" min="1" placeholder="页码">
                    <button class="jump-btn" onclick="jumpToPage()">跳转</button>
                </li>
            `;

            // 显示分页容器
            document.getElementById('pagination').classList.remove('d-none');
        }

        function jumpToPage() {
            const val = document.getElementById('jumpPageInput').value;
            const page = parseInt(val, 10);
            if (page && page > 0) fetchLatestMovies(page, true);
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && e.target && e.target.id === 'jumpPageInput') {
                jumpToPage();
            }
        });

        // ==========================================
        // 渐隐隐藏元素函数
        // ==========================================
        function fadeOut(element, duration = 1000) {
            if (!element) return;

            // 1. 设置过渡动画和目标透明度为 0
            element.style.transition = `opacity ${duration}ms ease`;
            element.style.opacity = '0';

            // 2. 等待动画结束 (300ms) 后，加上 d-none 彻底隐藏，并重置 inline 样式
            setTimeout(() => {
                element.classList.add('d-none');
                element.style.opacity = '';
                element.style.transition = '';
            }, duration);
        }

        // 初始化加载
        window.onload = () => fetchLatestMovies(1);
    </script>
{% endblock %}
