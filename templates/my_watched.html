{% extends "base.html" %}

{% block title %}我的看过 - JavDB{% endblock %}

{% block styles %}
    <style>
        .movie-card {
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: transform .25s ease, box-shadow .25s ease;
        }
        .movie-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-3);
        }
        .movie-card img { width: 100%; height: 220px; object-fit: cover; transition: transform .4s ease; }
        .movie-card:hover img { transform: scale(1.04); }
        .filter-section {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 .125rem .25rem rgba(0,0,0,.075);
        }
                /* ===== 筛选/排序按钮：未选中 ===== */
        .custom-radio-label {
            border: 1px solid #e5e7eb !important;
            border-radius: 0.375rem !important;
            padding: 0.375rem 0.75rem;
            background-color: #ffffff !important;
            color: #4b5563 !important;
            font-weight: 500;
            margin-bottom: 4px;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }
        /* ===== 未选中悬停 ===== */
        .btn-check:not(:checked) + .custom-radio-label:hover {
            background-color: #f5f6ff !important;
            border-color: #c7d2fe !important;
            color: #4f46e5 !important;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.12);
        }
        /* ===== 选中 ===== */
        .btn-check:checked + .custom-radio-label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: #fff !important;
            border-color: transparent !important;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
        }
        /* ===== 选中悬停 ===== */
        .btn-check:checked + .custom-radio-label:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
        }
        /* ===== 按下 ===== */
        .custom-radio-label:active {
            transform: scale(0.97);
        }

        /* 紧凑间距 */
        .filter-section .row {
            margin-bottom: 8px;
        }
        .filter-section .row:last-child {
            margin-bottom: 0;
        }

        /* =========================================
           纯文字极简标签专属精致样式
           ========================================= */
        /* 固定评分纯文字胶囊的外观，使其和“全部”按钮完美对称统一 */
        .text-tag {
            min-width: 45px;
            text-align: center;
        }

        /* ===== 分页容器 ===== */
        #pagination {
            margin-top: 2rem !important;
        }

        #paginationList {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            align-items: center;
        }

        #paginationList .page-item {
            margin: 0;
        }

        #paginationList .page-item .page-link {
            min-width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            margin-left: 0 !important;
            border: 1px solid #e9ecef;
            border-radius: 10px !important;
            background: #fff;
            color: #495057;
            font-weight: 500;
            font-size: 0.9rem;
            line-height: 1;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
            text-decoration: none;
        }

        #paginationList .page-item .page-link:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
            color: #4f46e5;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.12);
        }

        #paginationList .page-item.active .page-link {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
        }

        #paginationList .page-item.disabled .page-link {
            background: #f8f9fa;
            border-color: #f1f3f5;
            color: #adb5bd;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        #paginationList .page-item.disabled .page-link:hover {
            background: #f8f9fa;
            border-color: #f1f3f5;
            color: #adb5bd;
            transform: none;
            box-shadow: none;
        }

        /* ===== 跳页区 ===== */
        #paginationList .jump-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 10px;
        }

        #jumpPageInput {
            width: 64px;
            height: 40px;
            border-radius: 10px !important;
            border: 1px solid #e9ecef !important;
            text-align: center;
            font-weight: 500;
            color: #495057;
            transition: all 0.2s;
            padding: 0 !important;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        #jumpPageInput::-webkit-outer-spin-button,
        #jumpPageInput::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #jumpPageInput:focus {
            border-color: #a5b4fc !important;
            box-shadow: 0 0 0 3px rgba(165, 180, 252, 0.25);
            outline: none;
        }

        #paginationList .jump-btn {
            height: 40px;
            padding: 0 16px;
            border-radius: 10px !important;
            border: 1px solid #c7d2fe;
            background: #fff;
            color: #4f46e5;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            margin-left: 0 !important;
        }

        #paginationList .jump-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
            transform: translateY(-1px);
        }

        /* ===== 小屏适配 ===== */
        @media (max-width: 576px) {
            #paginationList { gap: 4px; }
            #paginationList .page-item .page-link {
                min-width: 34px;
                height: 34px;
                padding: 0 8px;
                font-size: 0.82rem;
            }
            #jumpPageInput,
            #paginationList .jump-btn {
                height: 34px;
            }
            #jumpPageInput { width: 54px; }
        }

                /* ===== 刷新按钮（品牌渐变） ===== */
        .btn-brand {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            border: none !important;
            color: #fff !important;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-brand:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
            color: #fff !important;
        }
        .btn-brand:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }
        .group-title {
            font-weight: 600;
            margin-top: 16px;
            margin-bottom: 10px;
            color: #374151;               /* 高级深灰 */
            padding-bottom: 6px;
            font-size: 0.95rem;
            letter-spacing: 0.3px; 
        }
    </style>
{% endblock %}

{% block content %}
    <h1 class="mb-4 text-center">✅ 我的看过</h1>
    <div class="filter-section border shadow-sm">
        <!-- 第一行：类型筛选 + 刷新按钮 -->
        <div class="row align-items-center">
            <div class="col-md-10 d-flex flex-wrap gap-2 align-items-center">
                <span class="fw-bold text-muted small group-title">类型：</span>

                <input type="radio" class="btn-check watched-type-radio" name="watchedType" id="wt_all" value="all" checked>
                <label class="btn custom-radio-label btn-sm" for="wt_all">全部</label>

                <input type="radio" class="btn-check watched-type-radio" name="watchedType" id="wt_0" value="0">
                <label class="btn custom-radio-label btn-sm" for="wt_0">有码</label>

                <input type="radio" class="btn-check watched-type-radio" name="watchedType" id="wt_1" value="1">
                <label class="btn custom-radio-label btn-sm" for="wt_1">无码</label>

                <input type="radio" class="btn-check watched-type-radio" name="watchedType" id="wt_2" value="2">
                <label class="btn custom-radio-label btn-sm" for="wt_2">欧美</label>

                <input type="radio" class="btn-check watched-type-radio" name="watchedType" id="wt_3" value="3">
                <label class="btn custom-radio-label btn-sm" for="wt_3">FC2</label>

                <input type="radio" class="btn-check watched-type-radio" name="watchedType" id="wt_4" value="4">
                <label class="btn custom-radio-label btn-sm" for="wt_4">动漫</label>
            </div>
            <div class="col-md-2 text-end">
                <button class="btn btn-brand btn-sm w-100" style="border-radius: 0.375rem;" onclick="loadWatched(1)">刷新</button>
            </div>
        </div>

        <!-- 第二行：排序 + 评分 -->
        <div class="row align-items-center">
            <div class="col-md-6 d-flex flex-wrap gap-2 align-items-center">
                <span class="fw-bold text-muted small group-title" style="white-space: nowrap;">排序：</span>

                <input type="radio" class="btn-check watched-sort-radio" name="watchedSort" id="ws_create_desc" value="create|desc" checked>
                <label class="btn custom-radio-label btn-sm" for="ws_create_desc">添加时间倒序</label>

                <input type="radio" class="btn-check watched-sort-radio" name="watchedSort" id="ws_create_asc" value="create|asc">
                <label class="btn custom-radio-label btn-sm" for="ws_create_asc">添加时间正序</label>

                <input type="radio" class="btn-check watched-sort-radio" name="watchedSort" id="ws_release_desc" value="release|desc">
                <label class="btn custom-radio-label btn-sm" for="ws_release_desc">发行时间倒序</label>

                <input type="radio" class="btn-check watched-sort-radio" name="watchedSort" id="ws_release_asc" value="release|asc">
                <label class="btn custom-radio-label btn-sm" for="ws_release_asc">发行时间正序</label>
            </div>
            <div class="col-md-6 d-flex flex-wrap gap-2 align-items-center">
                <span class="fw-bold text-muted small group-title" style="white-space: nowrap;">评分：</span>

                <input type="radio" class="btn-check watched-star-radio" name="watchedStar" id="ws_star_all" value="" checked>
                <label class="btn custom-radio-label btn-sm" for="ws_star_all">全部</label>

                <input type="radio" class="btn-check watched-star-radio" name="watchedStar" id="ws_star_5" value="5">
                <label class="btn custom-radio-label btn-sm text-tag" for="ws_star_5">5 星</label>

                <input type="radio" class="btn-check watched-star-radio" name="watchedStar" id="ws_star_4" value="4">
                <label class="btn custom-radio-label btn-sm text-tag" for="ws_star_4">4 星</label>

                <input type="radio" class="btn-check watched-star-radio" name="watchedStar" id="ws_star_3" value="3">
                <label class="btn custom-radio-label btn-sm text-tag" for="ws_star_3">3 星</label>

                <input type="radio" class="btn-check watched-star-radio" name="watchedStar" id="ws_star_2" value="2">
                <label class="btn custom-radio-label btn-sm text-tag" for="ws_star_2">2 星</label>

                <input type="radio" class="btn-check watched-star-radio" name="watchedStar" id="ws_star_1" value="1">
                <label class="btn custom-radio-label btn-sm text-tag" for="ws_star_1">1 星</label>

                <input type="radio" class="btn-check watched-star-radio" name="watchedStar" id="ws_star_0" value="0">
                <label class="btn custom-radio-label btn-sm" for="ws_star_0">未评价</label>
            </div>
        </div>
    </div>

    <div class="row" id="moviesContainer"></div>

    <nav aria-label="Page navigation" class="mt-4 d-none" id="pagination">
        <ul class="pagination justify-content-center mb-0" id="paginationList"></ul>
    </nav>
{% endblock %}

{% block scripts %}
<script>
    // 复用 fixImageUrl（由 base.html 提供）
    let currentPage = 1;
    const limit = 24;

    function renderMovieCards(movies) {
        const container = document.getElementById('moviesContainer');
        container.innerHTML = '';
        if (movies.length === 0) {
            container.innerHTML = '<div class="col-12 text-center text-muted py-5">暂无看过影片</div>';
            return;
        }
        movies.forEach(movie => {
            const coverFixed = `/api/image?url=${encodeURIComponent(movie.cover_url)}`;
            const detailUrl = `/movie/${movie.id}`;
            container.innerHTML += `
                <div class="col-md-3 mb-4">
                    <div class="card movie-card h-100 shadow-sm border-0">
                        <a href="${detailUrl}" class="card-link-block" target="_blank">
                            <div class="position-relative">
                                <img src="${coverFixed}" alt="${movie.number}" onerror="this.src='{{ url_for('static', filename='images/noimage.jpg') }}'">
                                <div class="position-absolute top-0 end-0 d-flex gap-1 m-2">
                                    ${ movie.new_magnets ? '<span class="badge bg-warning text-dark">新种</span>' : (movie.magnets_count > 0 ? '<span class="badge" style="background-color: #32ad76 !important;">含磁链</span>' : '') }
                                    ${ movie.has_cnsub ? '<span class="badge bg-info">中字</span>' : '' }
                                </div>
                            </div>
                            <div class="card-body p-3">
                                <h6 class="card-title text-truncate fw-bold" title="${movie.number}">${movie.number}</h6>
                                <p class="card-text small text-muted mb-2" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; height: 3.0em;" title="${movie.title}">${movie.title}</p>
                                <div class="d-flex justify-content-between mt-2">
                                    <span class="badge bg-light text-dark border">${ movie.release_date ? movie.release_date : '' }</span>
                                    <span class="badge bg-light text-dark border">${ movie.duration ? movie.duration+' 分钟' : '' }</span>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            `;
        });
    }

    function renderPagination(currentPage, loadedCount) {
        const paginationUl = document.getElementById('paginationList');
        paginationUl.innerHTML = '';

        // 本页不足 limit 条，视为最后一页
        const isLastPage = loadedCount < limit;

        // 首页
        paginationUl.innerHTML += `
            <li class="page-item ${currentPage <= 1 ? 'disabled' : ''}">
                <a class="page-link" href="javascript:void(0)"
                onclick="if(${currentPage} > 1) loadWatched(1, true)" title="首页">«</a>
            </li>
        `;

        // 上一页
        paginationUl.innerHTML += `
            <li class="page-item ${currentPage <= 1 ? 'disabled' : ''}">
                <a class="page-link" href="javascript:void(0)"
                onclick="if(${currentPage} > 1) loadWatched(${currentPage - 1}, true)" title="上一页">‹</a>
            </li>
        `;

        // 页码窗口
        const startPage = Math.max(1, currentPage - 2);
        const endPage = isLastPage ? currentPage : currentPage + 2;

        // 左省略号
        if (startPage > 1) {
            paginationUl.innerHTML += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
        }

        for (let i = startPage; i <= endPage; i++) {
            if (i === currentPage) {
                paginationUl.innerHTML += `<li class="page-item active"><span class="page-link">${i}</span></li>`;
            } else {
                paginationUl.innerHTML += `
                    <li class="page-item">
                        <a class="page-link" href="javascript:void(0)" onclick="loadWatched(${i}, true)">${i}</a>
                    </li>
                `;
            }
        }

        // 右省略号：仅当不是最后一页
        if (!isLastPage) {
            paginationUl.innerHTML += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
        }

        // 下一页
        paginationUl.innerHTML += `
            <li class="page-item ${isLastPage ? 'disabled' : ''}">
                <a class="page-link" href="javascript:void(0)"
                onclick="if(!${isLastPage}) loadWatched(${currentPage + 1}, true)" title="下一页">›</a>
            </li>
        `;

        // 跳页
        paginationUl.innerHTML += `
            <li class="jump-wrap">
                <input type="number" id="jumpPageInput" value="${currentPage + 1}" min="1" placeholder="页码">
                <button class="jump-btn" onclick="jumpToPage()">跳转</button>
            </li>
        `;

        document.getElementById('pagination').classList.remove('d-none');

        // 跳页输入框绑定回车
        const jumpInput = paginationUl.querySelector('#jumpPageInput');
        if (jumpInput) {
            jumpInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') jumpToPage();
            });
        }
    }

    function jumpToPage() {
        const val = document.getElementById('jumpPageInput').value;
        const p = parseInt(val, 10);
        if (p && p > 0) loadWatched(p, true);
    }

    async function loadWatched(page, scrollToTop = false) {
        currentPage = page;
        const container = document.getElementById('moviesContainer');
        const paginationEl = document.getElementById('pagination');

        container.innerHTML = `
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2 text-muted">加载中...</p>
            </div>
        `;
        paginationEl.classList.add('d-none');

        // 从 radio 获取值
        const typeRadio = document.querySelector('input[name="watchedType"]:checked');
        const type = typeRadio ? typeRadio.value : 'all';
        const sortRadio = document.querySelector('input[name="watchedSort"]:checked');
        const sortOption = sortRadio ? sortRadio.value : 'create|desc';
        const [sort_by, order_by] = sortOption.split('|');
        const starRadio = document.querySelector('input[name="watchedStar"]:checked');
        const star = starRadio ? starRadio.value : '';

        const params = new URLSearchParams({
            type: type,
            sort_by: sort_by,
            order_by: order_by,
            star: star,
            page: page,
            limit: limit
        });

        try {
            const res = await fetch('/api/my_watched?' + params.toString());
            const data = await res.json();
            if (!data.success) throw new Error(data.message || '加载失败');

            const movies = data.data.movies || [];
            renderMovieCards(movies);

            // 无条件渲染分页：空数据也显示，方便翻回
            renderPagination(page, movies.length);

            if (scrollToTop) {
                document.getElementById('moviesContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        } catch (e) {
            container.innerHTML = `
                <div class="col-12 text-center text-danger py-5">
                    加载失败：${e.message}
                    <div><button class="btn btn-primary mt-2" onclick="loadWatched(${currentPage}, true)">重试</button></div>
                </div>
            `;
            paginationEl.classList.add('d-none');
        }
    }

    // 防抖
    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => { func.apply(this, args); }, wait);
        };
    }
    const debouncedLoad = debounce(() => loadWatched(1), 500);

    document.addEventListener('DOMContentLoaded', function() {
        // 监听所有相关 radio 的变化
        document.querySelectorAll('.watched-type-radio, .watched-sort-radio, .watched-star-radio').forEach(el => {
            el.addEventListener('change', function() {
                const container = document.getElementById('moviesContainer');
                const paginationEl = document.getElementById('pagination');
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary"></div>
                        <p class="mt-2 text-muted">加载中...</p>
                    </div>
                `;
                paginationEl.classList.add('d-none');
                debouncedLoad();
            });
        });

        // 初始加载
        loadWatched(1);
    });
</script>
{% endblock %}
